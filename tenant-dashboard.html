<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Home - BoardingPay</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #eef8fd;

            color: #173b63;

            overflow-x: hidden;
        }


        /* =====================================================
           MAIN DASHBOARD
        ===================================================== */

        .boarding-dashboard {

            width: 100%;

            max-width: 500px;

            min-height: 100vh;

            margin: 0 auto;

            background: #f8fcff;

            padding-bottom: 75px;

            position: relative;

            overflow: hidden;

            box-shadow:
                0 0 30px rgba(0, 80, 130, .08);
        }


        /* =====================================================
           TENANT DASHBOARD ILLUSTRATION HEADER
           NO IMAGE FILE USED
        ===================================================== */

        .home-hero {

            position: relative;

            width: 100%;

            height: 255px;

            overflow: hidden;

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #ffffff 57%,
                    #eaf7fd 100%
                );

            color: #173b63;
        }


        /* =====================================================
           SOFT SKY SHAPES
        ===================================================== */

        .sky-shape {

            position: absolute;

            border-radius: 50%;

            background: #edf8fd;

            pointer-events: none;
        }


        .sky-shape.one {

            width: 150px;
            height: 150px;

            right: -45px;
            top: 45px;
        }


        .sky-shape.two {

            width: 90px;
            height: 90px;

            left: -35px;
            top: 125px;

            background: #f1faff;
        }


        /* =====================================================
           CLOUDS
        ===================================================== */

        .cloud {

            position: absolute;

            background: #d9f0fb;

            border-radius: 50%;

            opacity: .9;
        }


        .cloud.one {

            width: 62px;
            height: 21px;

            left: 20px;
            top: 155px;
        }


        .cloud.one::before {

            content: "";

            position: absolute;

            width: 31px;
            height: 31px;

            left: 9px;
            top: -16px;

            border-radius: 50%;

            background: #d9f0fb;
        }


        .cloud.one::after {

            content: "";

            position: absolute;

            width: 23px;
            height: 23px;

            left: 34px;
            top: -9px;

            border-radius: 50%;

            background: #d9f0fb;
        }


        .cloud.two {

            width: 74px;
            height: 24px;

            right: 8px;
            top: 134px;
        }


        .cloud.two::before {

            content: "";

            position: absolute;

            width: 36px;
            height: 36px;

            left: 11px;
            top: -18px;

            border-radius: 50%;

            background: #d9f0fb;
        }


        .cloud.two::after {

            content: "";

            position: absolute;

            width: 27px;
            height: 27px;

            right: 8px;
            top: -11px;

            border-radius: 50%;

            background: #d9f0fb;
        }


        /* =====================================================
           BRAND AREA
        ===================================================== */

        .hero-brand {

            position: absolute;

            left: 50%;

            top: 14px;

            transform: translateX(-50%);

            z-index: 20;

            width: 220px;

            text-align: center;
        }


        /* =====================================================
           INLINE HOUSE LOGO
        ===================================================== */

        .brand-logo {

            width: 72px;

            height: 62px;

            margin: 0 auto 3px;

            position: relative;
        }


        .brand-logo svg {

            width: 100%;

            height: 100%;

            display: block;
        }


        .brand-name {

            font-size: 25px;

            line-height: 1;

            font-weight: 800;

            letter-spacing: -.7px;

            color: #07559b;
        }


        .brand-tagline {

            margin-top: 7px;

            font-size: 11px;

            color: #71859a;

            font-weight: 500;

            letter-spacing: .1px;
        }


        /* =====================================================
           HEADER PROFILE
        ===================================================== */

        .hero-profile {

            position: absolute;

            top: 15px;

            right: 15px;

            width: 39px;

            height: 39px;

            border-radius: 50%;

            border: 1px solid #d7eaf5;

            background: rgba(255,255,255,.94);

            color: #1266a3;

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            z-index: 30;

            box-shadow:
                0 3px 10px rgba(0,75,120,.10);
        }


        .hero-profile svg {

            width: 19px;

            height: 19px;

            stroke: currentColor;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        /* =====================================================
           NOTIFICATION
        ===================================================== */

        .hero-notification {

            position: absolute;

            top: 18px;

            right: 62px;

            width: 32px;

            height: 32px;

            border: none;

            background: transparent;

            color: #1266a3;

            cursor: pointer;

            z-index: 30;
        }


        .hero-notification svg {

            width: 20px;

            height: 20px;

            stroke: currentColor;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        .notification-dot {

            position: absolute;

            width: 7px;

            height: 7px;

            top: 3px;

            right: 3px;

            border-radius: 50%;

            background: #f35d67;

            border: 1px solid white;
        }


        /* =====================================================
           GREETING
        ===================================================== */

        .hero-greeting {

            position: absolute;

            left: 20px;

            top: 112px;

            z-index: 25;
        }


        .hero-greeting h2 {

            color: #174d7b;

            font-size: 18px;

            line-height: 1.2;

            font-weight: 800;
        }


        .hero-greeting h2 span {

            color: #078bd0;
        }


        .hero-greeting p {

            margin-top: 5px;

            color: #71899c;

            font-size: 9px;
        }


        /* =====================================================
           CITY + HOUSES ILLUSTRATION
           INLINE CSS SHAPES
        ===================================================== */

        .city-illustration {

            position: absolute;

            left: 0;

            right: 0;

            bottom: 0;

            width: 100%;

            height: 105px;

            z-index: 5;

            pointer-events: none;
        }


        /* BACK CITY */

        .city-building {

            position: absolute;

            bottom: 0;

            background: #d7edf8;

            border-radius: 2px 2px 0 0;
        }


        .building-1 {

            left: 49%;

            width: 34px;

            height: 75px;
        }


        .building-2 {

            left: 57%;

            width: 29px;

            height: 53px;

            background: #cde8f5;
        }


        .building-3 {

            left: 65%;

            width: 40px;

            height: 86px;

            background: #d9eef8;
        }


        .building-4 {

            left: 75%;

            width: 29px;

            height: 61px;

            background: #cce8f6;
        }


        .building-5 {

            left: 83%;

            width: 39px;

            height: 47px;

            background: #d9eff9;
        }


        .building-window {

            position: absolute;

            width: 5px;

            height: 7px;

            background: #b8dced;

            border-radius: 1px;
        }


        /* =====================================================
           LARGE HOUSE
        ===================================================== */

        .main-house {

            position: absolute;

            left: 0;

            bottom: 0;

            width: 175px;

            height: 95px;

            z-index: 10;
        }


        .house-body {

            position: absolute;

            left: 17px;

            bottom: 0;

            width: 122px;

            height: 61px;

            background: #ffffff;

            border: 3px solid #b7def2;

            border-top: none;

            border-radius: 2px;
        }


        .house-roof {

            position: absolute;

            left: 8px;

            top: 13px;

            width: 128px;

            height: 75px;

            background: #ffffff;

            border-left: 6px solid #65b5e4;

            border-top: 6px solid #65b5e4;

            transform: rotate(45deg) scale(.72);

            border-radius: 4px 0 0 0;
        }


        .house-door {

            position: absolute;

            left: 68px;

            bottom: 0;

            width: 25px;

            height: 38px;

            background: #d8eef9;

            border-radius: 3px 3px 0 0;

            border: 2px solid #8bc9e9;
        }


        .house-window {

            position: absolute;

            width: 23px;

            height: 23px;

            background: #d9effa;

            border: 3px solid #69b7e4;

        }


        .house-window::before {

            content: "";

            position: absolute;

            left: 50%;

            top: 0;

            bottom: 0;

            width: 2px;

            transform: translateX(-50%);

            background: #69b7e4;
        }


        .house-window::after {

            content: "";

            position: absolute;

            top: 50%;

            left: 0;

            right: 0;

            height: 2px;

            transform: translateY(-50%);

            background: #69b7e4;
        }


        .window-left {

            left: 31px;

            bottom: 28px;
        }


        .window-right {

            left: 101px;

            bottom: 28px;
        }


        /* =====================================================
           SMALL HOUSE
        ===================================================== */

        .small-house {

            position: absolute;

            right: 87px;

            bottom: 0;

            width: 75px;

            height: 62px;

            z-index: 11;
        }


        .small-house-body {

            position: absolute;

            bottom: 0;

            left: 10px;

            width: 59px;

            height: 37px;

            background: #ffffff;

            border: 3px solid #b7def2;

            border-top: none;
        }


        .small-house-roof {

            position: absolute;

            left: 7px;

            top: 6px;

            width: 58px;

            height: 58px;

            background: #8ecce9;

            transform: rotate(45deg) scale(.7);

            border-radius: 4px;
        }


        .small-house-door {

            position: absolute;

            left: 34px;

            bottom: 0;

            width: 13px;

            height: 24px;

            background: #d2ebf7;

            border: 2px solid #82c5e5;

        }


        /* =====================================================
           TREES
        ===================================================== */

        .tree {

            position: absolute;

            bottom: -3px;

            width: 54px;

            height: 70px;

            z-index: 13;
        }


        .tree-left {

            left: 145px;
        }


        .tree-right {

            right: 0;

            width: 65px;

            transform: scale(1.1);
        }


        .tree-trunk {

            position: absolute;

            bottom: 0;

            left: 23px;

            width: 9px;

            height: 27px;

            background: #a9c7d4;

            border-radius: 3px;
        }


        .tree-leaf {

            position: absolute;

            border-radius: 50%;

            background: #91d4b7;
        }


        .leaf-1 {

            width: 40px;

            height: 40px;

            left: 2px;

            top: 15px;
        }


        .leaf-2 {

            width: 44px;

            height: 44px;

            right: 0;

            top: 8px;

            background: #77cba8;
        }


        .leaf-3 {

            width: 34px;

            height: 34px;

            left: 15px;

            top: 0;

            background: #a5dfc2;
        }


        /* =====================================================
           BALANCE CARD
        ===================================================== */

        .balance-card {

            position: relative;

            z-index: 100;

            width: calc(100% - 20px);

            min-height: 76px;

            margin:
                -9px
                10px
                10px;

            padding:
                11px
                13px;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #087ecf,
                    #238ed9
                );

            display: flex;

            align-items: center;

            gap: 10px;

            box-shadow:
                0 6px 14px
                rgba(0,87,145,.18);
        }


        .balance-icon {

            width: 40px;

            height: 40px;

            flex-shrink: 0;

            border-radius: 10px;

            background: rgba(255,255,255,.18);

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .balance-icon svg {

            width: 21px;

            height: 21px;

            stroke: white;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        .balance-information {

            flex: 1;

            min-width: 0;
        }


        .balance-information span {

            display: block;

            color: white;

            font-size: 8px;

            margin-bottom: 4px;
        }


        .balance-information h2 {

            color: white;

            font-size: 21px;

            line-height: 1;

            font-weight: 800;
        }


        .balance-pay-btn {

            min-width: 94px;

            height: 35px;

            padding: 0 10px;

            border: 0;

            border-radius: 20px;

            background: white;

            color: #173d6b;

            font-size: 8px;

            font-weight: 800;

            cursor: pointer;
        }


        .balance-pay-btn span {

            margin-left: 5px;

            font-size: 13px;
        }


        /* =====================================================
           QUICK ACTIONS
        ===================================================== */

        .quick-actions-card {

            width: calc(100% - 20px);

            margin:
                0
                10px
                10px;

            padding:
                13px
                5px;

            border-radius: 13px;

            background: white;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap:
                16px 2px;

            box-shadow:
                0 2px 10px
                rgba(0,65,100,.06);
        }


        .action-item {

            border: none;

            background: transparent;

            min-width: 0;

            color: #243d5d;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 7px;

            line-height: 1.15;

            text-align: center;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 5px;

            cursor: pointer;
        }


        .action-icon {

            width: 43px;

            height: 43px;

            border-radius: 11px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .action-icon svg {

            width: 20px;

            height: 20px;

            stroke: currentColor;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        .action-blue {
            background: #def2ff;
            color: #168bd0;
        }


        .action-green {
            background: #ddf6ec;
            color: #13a77a;
        }


        .action-purple {
            background: #e7e3ff;
            color: #6653d5;
        }


        .action-red {
            background: #ffe1e3;
            color: #e14f58;
        }


        .action-yellow {
            background: #fff0c9;
            color: #e9a527;
        }


        .action-lightblue {
            background: #dff3ff;
            color: #238bcf;
        }


        .action-violet {
            background: #e7e2ff;
            color: #6955d8;
        }


        .action-gray {
            background: #e4edf3;
            color: #506b80;
        }


        /* =====================================================
           RECENT PAYMENTS
        ===================================================== */

        .recent-payments-card {

            width: calc(100% - 20px);

            margin:
                0
                10px
                10px;

            padding: 11px;

            border-radius: 13px;

            background: white;

            box-shadow:
                0 2px 10px
                rgba(0,65,100,.06);
        }


        .recent-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 8px;
        }


        .recent-header h3 {

            color: #183e70;

            font-size: 12px;
        }


        .recent-header button {

            border: none;

            background: transparent;

            color: #1389d1;

            font-size: 7px;

            font-weight: 700;

            cursor: pointer;
        }


        .payment-record {

            min-height: 47px;

            padding: 6px;

            border:
                1px solid
                #edf2f5;

            border-radius: 9px;

            display: flex;

            align-items: center;

            gap: 8px;
        }


        .payment-check {

            width: 29px;

            height: 29px;

            flex-shrink: 0;

            border-radius: 50%;

            background: #3bb78a;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 14px;
        }


        .payment-record-info {

            flex: 1;

            display: flex;

            flex-direction: column;
        }


        .payment-record-info strong {

            color: #243e5d;

            font-size: 8px;
        }


        .payment-record-info span {

            color: #8b9aa6;

            font-size: 6px;

            margin-top: 2px;
        }


        .payment-record-amount {

            text-align: right;
        }


        .payment-record-amount strong {

            display: block;

            color: #1da878;

            font-size: 8px;
        }


        .payment-record-amount span {

            display: inline-block;

            margin-top: 2px;

            padding: 2px 5px;

            border-radius: 5px;

            background: #dff7ed;

            color: #20a878;

            font-size: 6px;
        }


        /* =====================================================
           BANNER
        ===================================================== */

        .home-banner {

            position: relative;

            width: calc(100% - 20px);

            height: 80px;

            margin:
                0
                10px
                10px;

            padding:
                10px
                12px;

            border-radius: 12px;

            overflow: hidden;

            background:
                linear-gradient(
                    110deg,
                    #dff4ff,
                    #c7e9fa
                );
        }


        .banner-text {

            position: relative;

            z-index: 5;
        }


        .banner-text strong {

            display: block;

            color: #183d6e;

            font-size: 10px;
        }


        .banner-text p {

            margin-top: 2px;

            color: #183d6e;

            font-size: 8px;

            font-weight: 600;

            line-height: 1.15;
        }


        .banner-text small {

            display: block;

            margin-top: 4px;

            color: #69859a;

            font-size: 5px;
        }


        .banner-phone {

            position: absolute;

            right: 51px;

            bottom: -13px;

            font-size: 51px;

            transform: rotate(-10deg);

            z-index: 3;
        }


        .banner-check {

            position: absolute;

            right: 13px;

            bottom: 16px;

            color: #168bd0;

            font-size: 19px;
        }


        /* =====================================================
           BOTTOM NAVIGATION
        ===================================================== */

        .bottom-navigation {

            position: fixed;

            left: 50%;

            bottom: 0;

            transform:
                translateX(-50%);

            width: 100%;

            max-width: 500px;

            height: 61px;

            background: white;

            border-top:
                1px solid
                #dce6ed;

            box-shadow:
                0 -3px 12px
                rgba(0,60,100,.09);

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            z-index: 9999;
        }


        .nav-item {

            border: none;

            background: transparent;

            color: #718493;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 3px;

            cursor: pointer;

            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }


        .nav-icon {

            width: 24px;

            height: 24px;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .nav-icon svg {

            width: 18px;

            height: 18px;

            stroke: currentColor;

            fill: none;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;
        }


        .nav-label {

            font-size: 7px;
        }


        .nav-item.active {

            color: #078bd0;

            font-weight: 700;
        }


        /* =====================================================
           BUTTON
        ===================================================== */

        button {

            -webkit-tap-highlight-color:
                transparent;
        }


        button:active {

            transform: scale(.97);
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 380px) {

            .home-hero {

                height: 245px;
            }


            .brand-name {

                font-size: 23px;
            }


            .brand-tagline {

                font-size: 10px;
            }


            .hero-greeting {

                left: 16px;

                top: 108px;
            }


            .hero-greeting h2 {

                font-size: 17px;
            }


            .main-house {

                transform: scale(.9);

                transform-origin:
                    left bottom;
            }


            .small-house {

                right: 75px;
            }


            .tree-left {

                left: 125px;

                transform: scale(.85);
            }


            .balance-information h2 {

                font-size: 20px;
            }


            .balance-pay-btn {

                min-width: 88px;
            }


            .action-icon {

                width: 40px;

                height: 40px;
            }
        }

    </style>

</head>


<body>


<main class="boarding-dashboard">


    <!-- =====================================================
         TENANT HOME ILLUSTRATION
         ALL VECTOR/CSS — NO IMAGE
    ====================================================== -->

    <section class="home-hero">


        <div class="sky-shape one"></div>

        <div class="sky-shape two"></div>


        <!-- CLOUDS -->

        <div class="cloud one"></div>

        <div class="cloud two"></div>


        <!-- =================================================
             BOARDINGPAY LOGO
             INLINE SVG
        ================================================== -->

        <div class="hero-brand">

            <div class="brand-logo">

                <svg
                    viewBox="0 0 100 82"
                    xmlns="http://www.w3.org/2000/svg">

                    <!-- House roof -->

                    <path
                        d="M12 38 L43 10 L65 29"
                        fill="none"
                        stroke="#07559b"
                        stroke-width="7"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>


                    <!-- House -->

                    <path
                        d="M21 35 V65 H62 V35"
                        fill="white"
                        stroke="#07559b"
                        stroke-width="6"
                        stroke-linejoin="round"/>


                    <!-- Window -->

                    <rect
                        x="34"
                        y="42"
                        width="14"
                        height="14"
                        rx="1"
                        fill="#42a8df"/>

                    <path
                        d="M41 42 V56 M34 49 H48"
                        stroke="white"
                        stroke-width="2"/>


                    <!-- Payment card -->

                    <rect
                        x="55"
                        y="37"
                        width="37"
                        height="24"
                        rx="4"
                        fill="#168bd0"
                        stroke="#07559b"
                        stroke-width="2"/>


                    <line
                        x1="61"
                        y1="45"
                        x2="86"
                        y2="45"
                        stroke="white"
                        stroke-width="2"/>


                    <circle
                        cx="84"
                        cy="54"
                        r="2"
                        fill="white"/>

                </svg>

<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =====================================================
           USER NAME
        ===================================================== */

        const userNameElement =
            document.getElementById(
                "dashboardUserName"
            );


        let fullName =
            localStorage.getItem(
                "profileFullName"
            );


        const currentUserType =
            localStorage.getItem(
                "currentUserType"
            );


        if (!fullName) {

            if (
                currentUserType ===
                "tenant"
            ) {

                fullName =
                    localStorage.getItem(
                        "tenantName"
                    );

            }

            else if (
                currentUserType ===
                "landlord"
            ) {

                fullName =
                    localStorage.getItem(
                        "landlordName"
                    );

            }

            else if (
                currentUserType ===
                "admin"
            ) {

                fullName =
                    localStorage.getItem(
                        "adminName"
                    );

            }

        }


        if (!fullName) {

            fullName = "User";

        }


        if (userNameElement) {

            userNameElement.textContent =
                fullName + "!";

        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        function goTo(page) {

            window.location.href = page;

        }


        /* HOME */

        const navHome =
            document.getElementById(
                "navHome"
            );

        if (navHome) {

            navHome.addEventListener(
                "click",
                function () {

                    goTo(
                        "dashboard.html"
                    );

                }
            );

        }


        /* PAYMENT */

        const navPayment =
            document.getElementById(
                "navPayment"
            );

        if (navPayment) {

            navPayment.addEventListener(
                "click",
                function () {

                    goTo(
                        "paymentmethod.html"
                    );

                }
            );

        }


        /* HISTORY */

        const navHistory =
            document.getElementById(
                "navHistory"
            );

        if (navHistory) {

            navHistory.addEventListener(
                "click",
                function () {

                    goTo(
                        "history.html"
                    );

                }
            );

        }


        /* PROFILE */

        const navProfile =
            document.getElementById(
                "navProfile"
            );

        if (navProfile) {

            navProfile.addEventListener(
                "click",
                function () {

                    goTo(
                        "profile.html"
                    );

            );

           PAY NOW
        ===================================================== */
