<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Welcome - JNJC Boarding HOUSE</title>

    <link
        rel="stylesheet"
        href="./style.css?v=32">

</head>

<body>

<main class="app welcome-page">

    <section class="welcome-container">

        <!-- =================================================
             SUCCESS ICON
        ================================================== -->

        <div class="success-icon-area">

            <div class="success-circle">
                ✓
            </div>

            <span class="ray ray-1"></span>
            <span class="ray ray-2"></span>
            <span class="ray ray-3"></span>
            <span class="ray ray-4"></span>
            <span class="ray ray-5"></span>
            <span class="ray ray-6"></span>

        </div>


        <!-- =================================================
             WELCOME TITLE
        ================================================== -->

        <h1>
            Welcome to<br>
            JNJC Boarding HOUSE!
        </h1>


        <!-- =================================================
             MESSAGE
        ================================================== -->

        <p class="welcome-message">

            Your BoardingPay account<br>
            has been successfully registered.

        </p>


        <!-- =================================================
             DASHBOARD BUTTON
        ================================================== -->

        <button
            type="button"
            class="dashboard-btn"
            id="goDashboardBtn">

            Go to Dashboard

        </button>


        <!-- =================================================
             BUILDING / HOUSE ILLUSTRATION
        ================================================== -->

        <div class="property-illustration">

            <!-- BACKGROUND BUILDING - LEFT -->
            <div class="building building-left">

                <div class="building-window"></div>
                <div class="building-window"></div>
                <div class="building-window"></div>
                <div class="building-window"></div>

            </div>


            <!-- BACKGROUND BUILDING - FAR LEFT -->
            <div class="building building-small-left">

                <div class="building-window"></div>
                <div class="building-window"></div>

            </div>


            <!-- BACKGROUND BUILDING - RIGHT -->
            <div class="building building-right">

                <div class="building-window"></div>
                <div class="building-window"></div>
                <div class="building-window"></div>
                <div class="building-window"></div>
                <div class="building-window"></div>

            </div>


            <!-- BACKGROUND BUILDING - FAR RIGHT -->
            <div class="building building-small-right">

                <div class="building-window"></div>
                <div class="building-window"></div>
                <div class="building-window"></div>

            </div>


            <!-- =================================================
                 MAIN BOARDING HOUSE
            ================================================== -->

            <div class="main-house">

                <!-- ROOF -->
                <div class="house-roof"></div>

                <!-- HOUSE BODY -->
                <div class="house-body">

                    <!-- LEFT WINDOW -->
                    <div class="house-window window-left">

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>


                    <!-- RIGHT WINDOW -->
                    <div class="house-window window-right">

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>


                    <!-- DOOR -->
                    <div class="house-door">

                        <div class="door-knob"></div>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 TREES
            ================================================== -->

            <div class="tree tree-left">

                <div class="tree-top"></div>
                <div class="tree-trunk"></div>

            </div>


            <div class="tree tree-left-small">

                <div class="tree-top"></div>
                <div class="tree-trunk"></div>

            </div>


            <div class="tree tree-right">

                <div class="tree-top"></div>
                <div class="tree-trunk"></div>

            </div>


            <div class="tree tree-right-small">

                <div class="tree-top"></div>
                <div class="tree-trunk"></div>

            </div>


            <!-- =================================================
                 CLOUD / GROUND
            ================================================== -->

            <div class="ground-cloud cloud-1"></div>
            <div class="ground-cloud cloud-2"></div>
            <div class="ground-cloud cloud-3"></div>
            <div class="ground-cloud cloud-4"></div>
            <div class="ground-cloud cloud-5"></div>

        </div>

    </section>

</main>


<script src="./script.js?v=32"></script>

</body>

</html>
