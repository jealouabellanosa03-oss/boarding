<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>BoardingPay</title>


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {
            margin: 0;
            background: #ffffff;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            overflow-x: hidden;

            color: #073f78;
        }


        /* =====================================================
           MAIN APP
        ===================================================== */

        .app {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            margin: 0 auto;

            position: relative;
            overflow: hidden;

            background: #ffffff;
        }


        .index-page {
            min-height: 100vh;
            width: 100%;

            position: relative;
            overflow: hidden;

            background: #ffffff;
        }


        /* =====================================================
           BRAND
        ===================================================== */

        .index-brand {
            position: absolute;

            top: 17px;
            left: 0;

            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            text-align: center;

            z-index: 50;
        }


        /* =====================================================
           BOARDINGPAY LOGO
        ===================================================== */

        .boarding-logo {
            position: relative;

            width: 116px;
            height: 76px;

            margin-bottom: 1px;
        }


        /* =====================================================
           LOGO HOUSE
        ===================================================== */

        .boarding-house {
            position: absolute;

            left: 11px;
            top: 2px;

            width: 70px;
            height: 62px;
        }


        .house-roof {
            position: absolute;

            width: 47px;
            height: 47px;

            left: 8px;
            top: 2px;

            border-left:
                5px solid #064b88;

            border-top:
                5px solid #064b88;

            transform: rotate(45deg);

            border-radius: 2px;
        }


        .house-body {
            position: absolute;

            left: 8px;
            top: 26px;

            width: 47px;
            height: 35px;

            background: #ffffff;

            border-left:
                5px solid #064b88;

            border-right:
                5px solid #064b88;

            border-bottom:
                5px solid #064b88;
        }


        /* =====================================================
           LOGO WINDOW
        ===================================================== */

        .house-window {
            position: absolute;

            left: 10px;
            top: 8px;

            width: 18px;
            height: 18px;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            grid-template-rows:
                1fr 1fr;

            gap: 2px;
        }


        .house-window span {
            display: block;

            background: #159bdc;

            border-radius: 1px;
        }


        /* =====================================================
           LOGO DOOR
        ===================================================== */

        .house-door {
            position: absolute;

            right: 5px;
            bottom: 0;

            width: 10px;
            height: 19px;

            background: #064b88;

            border-radius:
                2px 2px 0 0;
        }


        /* =====================================================
           PAYMENT CARD
        ===================================================== */

        .boarding-card {
            position: absolute;

            width: 38px;
            height: 25px;

            right: 0;
            top: 31px;

            background: #078bd5;

            border-radius: 4px;

            transform: rotate(-5deg);

            box-shadow:
                0 2px 4px
                rgba(0, 0, 0, .12);
        }


        .card-top-line {
            position: absolute;

            left: 6px;
            top: 6px;

            width: 26px;
            height: 3px;

            background: #ffffff;

            border-radius: 2px;
        }


        .card-bottom-line {
            position: absolute;

            left: 7px;
            bottom: 5px;

            width: 14px;
            height: 3px;

            background: #ffffff;

            border-radius: 2px;
        }


        /* =====================================================
           BRAND NAME
        ===================================================== */

        .index-brand h1 {
            margin: 0;
            padding: 0;

            font-size: 25px;

            line-height: 1;

            font-weight: 800;

            letter-spacing:
                -1.3px;

            color: #073f78;
        }


        .index-brand h1 span {
            color: #078bd5;
        }


        /* =====================================================
           SLOGAN
        ===================================================== */

        .index-brand p {
            margin: 9px 0 0;
            padding: 0;

            font-size: 13px;

            line-height: 1;

            font-weight: 400;

            letter-spacing: .1px;

            color: #7893a5;
        }


        /* =====================================================
           BUTTON AREA
           CENTERED IN THE OPEN SPACE
        ===================================================== */

        .index-buttons {
            position: absolute;

            left: 50%;

            /*
             * MOVED FARTHER DOWN
             * TO CENTER THE BUTTONS
             * IN THE OPEN AREA
             */
            top: 285px;

            bottom: auto;

            width: 240px;

            max-width:
                calc(100% - 36px);

            transform:
                translateX(-50%);

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 10px;

            z-index: 100;
        }


        /* =====================================================
           BUTTON BASE
        ===================================================== */

        .index-btn {
            display: flex;

            align-items: center;
            justify-content: center;

            /*
             * ORIGINAL BUTTON SIZE RESTORED
             */
            width: 100%;
            height: 43px;

            padding: 0;
            margin: 0;

            border-radius: 8px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 13px;

            font-weight: 700;

            line-height: 1;

            text-align: center;

            cursor: pointer;

            outline: none;

            transition:
                background .2s ease,
                transform .2s ease;

            -webkit-tap-highlight-color:
                transparent;
        }


        /* =====================================================
           GET STARTED
        ===================================================== */

        .primary-btn {

            border:
                1px solid #078bd5;

            background: #078bd5;

            color: #ffffff;

            box-shadow:
                0 3px 8px
                rgba(7,139,213,.20);
        }


        .primary-btn:hover {

            background: #067fc5;

            border-color: #067fc5;
        }


        .primary-btn:active {

            transform: scale(.98);
        }


        /* =====================================================
           LOG IN
        ===================================================== */

        .secondary-btn {

            border:
                1px solid #078bd5;

            background: #ffffff;

            color: #078bd5;
        }


        .secondary-btn:hover {

            background: #f2f9fd;
        }


        .secondary-btn:active {

            transform: scale(.98);
        }


        /* =====================================================
           LOWER ILLUSTRATION
        ===================================================== */

        .index-illustration {

            position: absolute;

            left: 0;
            bottom: 0;

            width: 100%;

            height: 265px;

            overflow: hidden;

            z-index: 2;

            pointer-events: none;

            background:
                linear-gradient(
                    to bottom,
                    rgba(255,255,255,0),
                    rgba(249,253,255,.3) 32%,
                    #e9f7fd 100%
                );
        }


        /* =====================================================
           BACKGROUND CIRCLE
        ===================================================== */

        .background-circle {

            position: absolute;

            width: 50px;
            height: 50px;

            border-radius: 50%;

            background: #d7edf9;

            left: 29%;

            top: 28px;

            opacity: .7;
        }


        /* =====================================================
           CITY BUILDINGS
        ===================================================== */

        .city-building {

            position: absolute;

            bottom: 43px;

            background: #d5edf9;

            border-radius:
                3px 3px 0 0;
        }


        .city-one {

            width: 34px;
            height: 68px;

            left: 40%;

            opacity: .72;
        }


        .city-two {

            width: 31px;
            height: 94px;

            left: 49%;

            opacity: .80;
        }


        .city-three {

            width: 38px;
            height: 123px;

            left: 61%;

            opacity: .90;
        }


        .city-four {

            width: 43px;
            height: 78px;

            right: -5px;

            opacity: .72;
        }


        /* =====================================================
           CITY WINDOWS
        ===================================================== */

        .city-window {

            position: absolute;

            width: 5px;
            height: 7px;

            background: #c0e4f5;

            border-radius: 1px;
        }


        .city-one .cw1 {
            left: 7px;
            top: 14px;
        }


        .city-one .cw2 {
            left: 20px;
            top: 14px;
        }


        .city-one .cw3 {
            left: 7px;
            top: 30px;
        }


        .city-two .cw1 {
            left: 7px;
            top: 14px;
        }


        .city-two .cw2 {
            left: 19px;
            top: 14px;
        }


        .city-two .cw3 {
            left: 7px;
            top: 31px;
        }


        .city-two .cw4 {
            left: 19px;
            top: 31px;
        }


        .city-three .cw1 {
            left: 8px;
            top: 15px;
        }


        .city-three .cw2 {
            left: 23px;
            top: 15px;
        }


        .city-three .cw3 {
            left: 8px;
            top: 33px;
        }


        .city-three .cw4 {
            left: 23px;
            top: 33px;
        }


        .city-four .cw1 {
            left: 8px;
            top: 14px;
        }


        .city-four .cw2 {
            left: 22px;
            top: 14px;
        }


        /* =====================================================
           MAIN HOUSE
        ===================================================== */

        .main-house {

            position: absolute;

            left: -13px;

            bottom: -28px;

            width: 158px;
            height: 140px;

            z-index: 18;
        }


        .main-house-roof {

            position: absolute;

            left: 15px;
            top: 8px;

            width: 101px;
            height: 101px;

            background: #ffffff;

            border-left:
                7px solid #70b9e6;

            border-top:
                7px solid #70b9e6;

            transform: rotate(45deg);

            border-radius: 3px;
        }


        .main-house-body {

            position: absolute;

            left: 16px;
            top: 59px;

            width: 110px;
            height: 81px;

            background: #ffffff;

            border-left:
                6px solid #70b9e6;

            border-right:
                6px solid #70b9e6;

            border-bottom:
                6px solid #70b9e6;

            border-radius: 2px;
        }


        /* =====================================================
           MAIN HOUSE WINDOWS
        ===================================================== */

        .main-window {

            position: absolute;

            width: 27px;
            height: 27px;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            grid-template-rows:
                1fr 1fr;

            gap: 2px;

            border:
                3px solid #70b9e6;
        }


        .main-window span {

            display: block;

            background: #b9e2f5;
        }


        .main-window-left {

            left: 15px;
            top: 18px;
        }


        .main-window-right {

            left: 57px;
            top: 18px;
        }


        /* =====================================================
           MAIN HOUSE DOOR
        ===================================================== */

        .main-door {

            position: absolute;

            right: 10px;
            bottom: 0;

            width: 21px;
            height: 40px;

            background: #70b9e6;

            border-radius:
                3px 3px 0 0;
        }


        /* =====================================================
           SMALL HOUSE
        ===================================================== */

        .small-house {

            position: absolute;

            left: 106px;
            bottom: -18px;

            width: 91px;
            height: 74px;

            z-index: 19;
        }


        .small-house-roof {

            position: absolute;

            left: 8px;
            top: 3px;

            width: 59px;
            height: 59px;

            background: #ffffff;

            border-left:
                5px solid #83c5eb;

            border-top:
                5px solid #83c5eb;

            transform: rotate(45deg);
        }


        .small-house-body {

            position: absolute;

            left: 9px;
            top: 32px;

            width: 66px;
            height: 42px;

            background: #ffffff;

            border-left:
                4px solid #83c5eb;

            border-right:
                4px solid #83c5eb;

            border-bottom:
                4px solid #83c5eb;
        }


        /* =====================================================
           SMALL HOUSE WINDOW
        ===================================================== */

        .small-house-window {

            position: absolute;

            left: 10px;
            top: 9px;

            width: 17px;
            height: 17px;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            grid-template-rows:
                1fr 1fr;

            gap: 2px;

            border:
                2px solid #83c5eb;
        }


        .small-house-window span {

            background: #c5e6f6;
        }


        /* =====================================================
           SMALL HOUSE DOOR
        ===================================================== */

        .small-house-door {

            position: absolute;

            right: 7px;
            bottom: 0;

            width: 11px;
            height: 22px;

            background: #83c5eb;

            border-radius:
                2px 2px 0 0;
        }


        /* =====================================================
           BUSHES
        ===================================================== */

        .bush {

            position: absolute;

            border-radius: 50%;

            background: #79bfe8;

            z-index: 20;
        }


        .bush-one {

            width: 44px;
            height: 44px;

            right: 87px;
            bottom: -4px;
        }


        .bush-two {

            width: 55px;
            height: 55px;

            right: 44px;
            bottom: -12px;
        }


        .bush-three {

            width: 45px;
            height: 45px;

            right: 2px;
            bottom: -5px;
        }


        /* =====================================================
           GROUND
        ===================================================== */

        .illustration-ground {

            position: absolute;

            left: -12%;
            bottom: -40px;

            width: 124%;
            height: 88px;

            background: #cde9f8;

            border-radius:
                50% 50% 0 0;

            z-index: 16;
        }


        /* =====================================================
           SMALL PHONES
        ===================================================== */

        @media (max-width: 360px) {

            .index-brand {
                top: 12px;
            }


            .boarding-logo {

                transform: scale(.90);

                transform-origin:
                    center top;

                margin-bottom: -5px;
            }


            .index-brand h1 {
                font-size: 23px;
            }


            .index-brand p {

                font-size: 12px;

                margin-top: 8px;
            }


            /* BUTTONS CENTERED LOWER */

            .index-buttons {

                left: 50%;

                top: 270px;

                bottom: auto;

                width: 240px;

                max-width:
                    calc(100% - 30px);

                transform:
                    translateX(-50%);

                gap: 8px;
            }


            .index-btn {

                height: 43px;

                font-size: 13px;
            }


            .index-illustration {

                height: 235px;
            }


            .main-house {

                bottom: -20px;

                transform: scale(.90);

                transform-origin:
                    left bottom;

                z-index: 18;
            }


            .small-house {

                bottom: -12px;

                transform: scale(.90);

                transform-origin:
                    left bottom;

                z-index: 19;
            }

        }


        /* =====================================================
           VERY SMALL / SHORT PHONES
        ===================================================== */

        @media (max-height: 650px) {

            .index-brand {
                top: 10px;
            }


            .index-buttons {

                left: 50%;

                top: 245px;

                bottom: auto;

                width: 225px;

                gap: 7px;

                transform:
                    translateX(-50%);
            }


            .index-btn {

                height: 40px;

                font-size: 12px;
            }


            .index-illustration {

                height: 225px;
            }


            .main-house {

                bottom: -25px;

                transform: scale(.82);

                transform-origin:
                    left bottom;

                z-index: 18;
            }


            .small-house {

                bottom: -15px;

                transform: scale(.82);

                transform-origin:
                    left bottom;

                z-index: 19;
            }

        }


        /* =====================================================
           DESKTOP
        ===================================================== */

        @media (min-width: 431px) {

            .app {

                box-shadow:
                    0 0 35px
                    rgba(0,0,0,.08);
            }

        }

    </style>

</head>


<body>


<main class="app index-page">


    <!-- =====================================================
         BRAND
    ===================================================== -->

    <section class="index-brand">


        <div class="boarding-logo">


            <!-- HOUSE LOGO -->

            <div class="boarding-house">

                <div class="house-roof"></div>

                <div class="house-body">


                    <div class="house-window">

                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>

                    </div>


                    <div class="house-door"></div>

                </div>

            </div>


            <!-- PAYMENT CARD -->

            <div class="boarding-card">

                <div class="card-top-line"></div>

                <div class="card-bottom-line"></div>

            </div>


        </div>


        <!-- BRAND NAME -->

        <h1>
            Boarding<span>Pay</span>
        </h1>


        <!-- SLOGAN -->

        <p>
            Manage. Pay. Stay.
        </p>


    </section>


    <!-- =====================================================
         BUTTONS
         CENTERED LOWER
    ===================================================== -->

    <section class="index-buttons">


        <button
            type="button"
            id="getStartedBtn"
            class="index-btn primary-btn"
        >
            Get Started
        </button>


        <button
            type="button"
            id="loginBtn"
            class="index-btn secondary-btn"
        >
            Log In
        </button>


    </section>


    <!-- =====================================================
         LOWER ILLUSTRATION
    ===================================================== -->

    <section
        class="index-illustration"
        aria-hidden="true"
    >


        <!-- CITY 1 -->

        <div class="city-building city-one">

            <span class="city-window cw1"></span>
            <span class="city-window cw2"></span>
            <span class="city-window cw3"></span>

        </div>


        <!-- CITY 2 -->

        <div class="city-building city-two">

            <span class="city-window cw1"></span>
            <span class="city-window cw2"></span>
            <span class="city-window cw3"></span>
            <span class="city-window cw4"></span>

        </div>


        <!-- CITY 3 -->

        <div class="city-building city-three">

            <span class="city-window cw1"></span>
            <span class="city-window cw2"></span>
            <span class="city-window cw3"></span>
            <span class="city-window cw4"></span>

        </div>


        <!-- CITY 4 -->

        <div class="city-building city-four">

            <span class="city-window cw1"></span>
            <span class="city-window cw2"></span>

        </div>


        <!-- BACKGROUND CIRCLE -->

        <div class="background-circle"></div>


        <!-- MAIN HOUSE -->

        <div class="main-house">

            <div class="main-house-roof"></div>

            <div class="main-house-body">


                <div class="main-window main-window-left">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <div class="main-window main-window-right">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <div class="main-door"></div>


            </div>

        </div>


        <!-- SMALL HOUSE -->

        <div class="small-house">

            <div class="small-house-roof"></div>

            <div class="small-house-body">


                <div class="small-house-window">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>


                <div class="small-house-door"></div>


            </div>

        </div>


        <!-- BUSHES -->

        <div class="bush bush-one"></div>

        <div class="bush bush-two"></div>

        <div class="bush bush-three"></div>


        <!-- GROUND -->

        <div class="illustration-ground"></div>


    </section>


</main>


<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>

    /* =====================================================
       GET STARTED
    ===================================================== */

    const getStartedBtn =
        document.getElementById("getStartedBtn");


    if (getStartedBtn) {

        getStartedBtn.addEventListener(
            "click",
            function () {

                window.location.href =
                    "create-account.html";

            }
        );

    }


    /* =====================================================
       LOGIN
    ===================================================== */

    const loginBtn =
        document.getElementById("loginBtn");


    if (loginBtn) {

        loginBtn.addEventListener(
            "click",
            function () {

                window.location.href =
                    "login.html";

            }
        );

    }

</script>


</body>

</html>
