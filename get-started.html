<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - BoardingPay</title>

    <link rel="stylesheet" href="./style.css?v=2">
</head>

<body>

    <main class="app registration-page">

        <!-- HEADER -->
        <header class="registration-header">

            <button
                type="button"
                id="backBtn"
                class="back-btn">
                ‹
            </button>

            <div class="header-title">
                <h1>Create Account</h1>
                <p>Choose your account type</p>
            </div>

        </header>


        <!-- ACCOUNT TYPES -->
        <section class="account-types">


            <!-- TENANT -->
            <button
                type="button"
                id="tenantBtn"
                class="account-card">

                <div class="account-icon tenant-icon">
                    <span>●</span>
                </div>

                <div class="account-info">
                    <h2>Tenant</h2>

                    <p>
                        Manage your room, payments,
                        and stay easily.
                    </p>
                </div>

                <span class="arrow">›</span>

            </button>


            <!-- LANDLORD -->
            <button
                type="button"
                id="landlordBtn"
                class="account-card">

                <div class="account-icon landlord-icon">
                    <span>⌂</span>
                </div>

                <div class="account-info">
                    <h2>Landlord</h2>

                    <p>
                        Manage your rooms, tenants,
                        and payments.
                    </p>
                </div>

                <span class="arrow">›</span>

            </button>


            <!-- ADMIN -->
            <button
                type="button"
                id="adminBtn"
                class="account-card">

                <div class="account-icon admin-icon">
                    <span>⚙</span>
                </div>

                <div class="account-info">
                    <h2>Admin</h2>

                    <p>
                        Manage users and system
                        administration.
                    </p>
                </div>

                <span class="arrow">›</span>

            </button>


        </section>

    </main>


    <script src="./script.js"></script>

</body>

</html>
