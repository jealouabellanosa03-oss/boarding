<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <title>BoardingPay - Log In</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body.login-body {

            min-height: 100vh;

            background: #e8f3f8;

            display: flex;

            justify-content: center;

            align-items: flex-start;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #123f68;

            overflow-x: hidden;
        }


        .login-app {

            width: 100%;

            max-width: 430px;

            min-height: 100vh;

            background: #ffffff;

            position: relative;

            overflow: hidden;

            box-shadow:
                0 0 35px
                rgba(20, 70, 100, .12);
        }


        .bp-login-page {

            width: 100%;

            min-height: 100vh;

            background: #ffffff;

            display: flex;

            flex-direction: column;

            align-items: center;

            padding: 34px 14px 0;

            position: relative;

            overflow: hidden;
        }


        /* =========================================
           LOGO
        ========================================== */

        .bp-logo {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            margin-bottom: 20px;

            position: relative;

            z-index: 20;
        }


        .bp-house {

            position: relative;

            width: 82px;

            height: 62px;

            margin-bottom: 2px;
        }


        .bp-house-roof {

            position: absolute;

            width: 51px;

            height: 51px;

            left: 13px;

            top: 7px;

            border-left:
                6px solid #064b88;

            border-top:
                6px solid #064b88;

            transform: rotate(45deg);

            border-radius: 3px;
        }


        .bp-house-body {

            position: absolute;

            width: 51px;

            height: 39px;

            left: 13px;

            top: 24px;

            background: #ffffff;

            border-left:
                5px solid #064b88;

            border-right:
                5px solid #064b88;

            border-bottom:
                5px solid #064b88;
        }


        .bp-windows {

            position: absolute;

            left: 11px;

            top: 8px;

            width: 19px;

            height: 19px;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            grid-template-rows:
                1fr 1fr;

            gap: 2px;
        }


        .bp-windows span {

            background: #18a2df;

            border-radius: 1px;
        }


        .bp-door {

            position: absolute;

            width: 10px;

            height: 19px;

            right: 5px;

            bottom: 0;

            background: #064b88;

            border-radius:
                2px 2px 0 0;
        }


        .bp-payment-card {

            position: absolute;

            width: 35px;

            height: 23px;

            background: #078bd5;

            border-radius: 3px;

            right: 3px;

            top: 34px;

            transform: rotate(-5deg);

            box-shadow:
                0 2px 3px
                rgba(0, 0, 0, .12);
        }


        .bp-payment-card::before {

            content: "";

            position: absolute;

            left: 6px;

            top: 5px;

            width: 23px;

            height: 3px;

            background: #ffffff;

            border-radius: 2px;
        }


        .bp-payment-card::after {

            content: "";

            position: absolute;

            left: 7px;

            bottom: 5px;

            width: 14px;

            height: 3px;

            background: #ffffff;

            border-radius: 2px;
        }


        .bp-brand {

            font-size: 26px;

            line-height: 1;

            font-weight: 800;

            letter-spacing: -1.2px;

            color: #073f78;
        }


        .bp-brand span {
            color: #078bd5;
        }


        .bp-slogan {

            margin-top: 8px;

            color: #7893a5;

            font-size: 13px;

            font-weight: 400;

            letter-spacing: .2px;

            text-align: center;
        }


        /* =========================================
           LOGIN FORM
        ========================================== */

        #loginForm {

            width: 100%;

            max-width: 365px;

            display: flex;

            flex-direction: column;

            position: relative;

            z-index: 20;
        }


        .bp-input {

            width: 100%;

            height: 46px;

            display: flex;

            align-items: center;

            position: relative;

            background: #f8fcfe;

            border:
                1px solid #d7e6ee;

            border-radius: 8px;

            margin-bottom: 11px;

            overflow: hidden;
        }


        .bp-input:focus-within {

            background: #ffffff;

            border-color: #1594d8;

            box-shadow:
                0 0 0 2px
                rgba(21,148,216,.08);
        }


        .bp-icon {

            width: 42px;

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #7595aa;

            font-size: 17px;

            flex-shrink: 0;
        }


        .bp-input select,
        .bp-input input {

            flex: 1;

            width: 100%;

            height: 100%;

            border: none;

            outline: none;

            background: transparent;

            padding:
                0 8px 0 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 13px;

            color: #163e61;
        }


        .bp-input select {

            cursor: pointer;

            appearance: auto;
        }


        .bp-input input::placeholder {

            color: #9aacb8;

            opacity: 1;
        }


        .bp-eye {

            width: 42px;

            height: 100%;

            border: none;

            background: transparent;

            color: #7893a5;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 17px;

            cursor: pointer;

            flex-shrink: 0;
        }


        .bp-eye:hover {
            color: #087dcc;
        }


        /* =========================================
           ROOM SELECTOR
        ========================================== */

        #roomGroup {

            display: none;

            width: 100%;

            margin-bottom: 11px;
        }


        #roomGroup.show {
            display: block;
        }


        .room-label {

            display: block;

            margin-bottom: 6px;

            font-size: 12px;

            font-weight: 700;

            color: #365b78;
        }


        #roomSelect {

            width: 100%;

            height: 46px;

            border:
                1px solid #d7e6ee;

            border-radius: 8px;

            background: #f8fcfe;

            color: #163e61;

            padding: 0 12px;

            font-size: 13px;

            outline: none;

            cursor: pointer;
        }


        #roomSelect:focus {

            background: #ffffff;

            border-color: #1594d8;

            box-shadow:
                0 0 0 2px
                rgba(21,148,216,.08);
        }


        #roomInfo {

            display: none;

            margin-top: 5px;

            margin-bottom: 2px;

            font-size: 10px;

            line-height: 1.4;

            color: #7893a5;
        }


        #roomInfo.show {
            display: block;
        }


        /* =========================================
           MESSAGE
        ========================================== */

        #loginMessage {

            width: 100%;

            min-height: 18px;

            text-align: center;

            font-size: 11px;

            line-height: 1.3;

            margin:
                -2px 0 6px;

            position: relative;

            z-index: 25;
        }


        #loginMessage.error {
            color: #d93025;
        }


        #loginMessage.success {
            color: #188038;
        }


        /* =========================================
           LOGIN BUTTON
        ========================================== */

        .bp-login-button {

            width: 100%;

            height: 44px;

            border: none;

            border-radius: 8px;

            background: #168fd4;

            color: #ffffff;

            font-size: 13px;

            font-weight: 700;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            cursor: pointer;

            margin-top: 1px;

            box-shadow:
                0 2px 5px
                rgba(8,125,204,.15);

            transition: .2s ease;
        }


        .bp-login-button:hover {
            background: #087dcc;
        }


        .bp-login-button:active {
            transform: scale(.985);
        }


        .bp-login-button:disabled {

            opacity: .65;

            cursor: not-allowed;
        }


        /* =========================================
           FORGOT PASSWORD
        ========================================== */

        .bp-forgot {

            display: block;

            width: 100%;

            text-align: center;

            margin-top: 13px;

            color: #078bd5;

            font-size: 11px;

            font-weight: 600;

            text-decoration: none;
        }


        .bp-forgot:hover {
            text-decoration: underline;
        }


        /* =========================================
           CREATE ACCOUNT
        ========================================== */

        .bp-create {

            width: 100%;

            text-align: center;

            margin-top: 12px;

            font-size: 11px;

            color: #7893a5;
        }


        .bp-create a {

            color: #078bd5;

            font-weight: 700;

            text-decoration: none;
        }


        .bp-create a:hover {
            text-decoration: underline;
        }


        /* =========================================
           BACKGROUND
        ========================================== */

        .bp-bg-illustration {

            position: absolute;

            left: 0;

            right: 0;

            bottom: 0;

            height: 235px;

            overflow: hidden;

            pointer-events: none;

            z-index: 1;

            background:
                linear-gradient(
                    to bottom,
                    rgba(255,255,255,0),
                    rgba(244,251,255,.75) 55%,
                    #e8f6fc 100%
                );
        }


        .city {

            position: absolute;

            bottom: 49px;

            background: #d9eef9;

            border-radius:
                4px 4px 0 0;
        }


        .city-1 {

            width: 34px;

            height: 61px;

            left: 38%;

            opacity: .72;
        }


        .city-2 {

            width: 30px;

            height: 91px;

            left: 52%;

            opacity: .8;
        }


        .city-3 {

            width: 39px;

            height: 113px;

            left: 65%;

            opacity: .9;
        }


        .city-4 {

            width: 45px;

            height: 76px;

            right: -5px;

            opacity: .72;
        }


        .bg-house {

            position: absolute;

            left: -7px;

            bottom: 27px;

            width: 145px;

            height: 125px;

            z-index: 5;
        }


        .bg-roof {

            position: absolute;

            left: 13px;

            top: 8px;

            width: 94px;

            height: 94px;

            background: #ffffff;

            border-left:
                7px solid #73bce8;

            border-top:
                7px solid #73bce8;

            transform: rotate(45deg);

            border-radius: 3px;
        }


        .bg-house-body {

            position: absolute;

            left: 15px;

            top: 53px;

            width: 103px;

            height: 72px;

            background: #ffffff;

            border-left:
                6px solid #73bce8;

            border-right:
                6px solid #73bce8;

            border-bottom:
                6px solid #73bce8;

            border-radius: 2px;
        }


        .bg-window {

            position: absolute;

            width: 27px;

            height: 27px;

            background:
                linear-gradient(
                    to right,
                    transparent 45%,
                    #73bce8 45%,
                    #73bce8 55%,
                    transparent 55%
                ),
                linear-gradient(
                    to bottom,
                    transparent 45%,
                    #73bce8 45%,
                    #73bce8 55%,
                    transparent 55%
                );

            border:
                3px solid #73bce8;

            border-radius: 2px;
        }


        .bg-window-1 {

            left: 16px;

            top: 18px;
        }


        .bg-window-2 {

            left: 58px;

            top: 18px;
        }


        .bg-door {

            position: absolute;

            width: 20px;

            height: 38px;

            right: 10px;

            bottom: 0;

            background: #73bce8;

            border-radius:
                3px 3px 0 0;
        }


        .small-house {

            position: absolute;

            left: 112px;

            bottom: 33px;

            width: 82px;

            height: 65px;

            z-index: 6;
        }


        .small-roof {

            position: absolute;

            left: 8px;

            top: 2px;

            width: 55px;

            height: 55px;

            background: #ffffff;

            border-left:
                5px solid #8cc9ee;

            border-top:
                5px solid #8cc9ee;

            transform: rotate(45deg);
        }


        .small-body {

            position: absolute;

            left: 8px;

            top: 28px;

            width: 60px;

            height: 38px;

            background: #ffffff;

            border-left:
                4px solid #8cc9ee;

            border-right:
                4px solid #8cc9ee;

            border-bottom:
                4px solid #8cc9ee;
        }


        .tree {

            position: absolute;

            bottom: 39px;

            width: 48px;

            height: 85px;

            z-index: 8;
        }


        .tree span {

            position: absolute;

            display: block;

            border-radius: 50%;

            background: #78bee8;
        }


        .tree span:nth-child(1) {

            width: 43px;

            height: 43px;

            left: 0;

            top: 10px;
        }


        .tree span:nth-child(2) {

            width: 48px;

            height: 48px;

            left: 18px;

            top: 25px;
        }


        .tree span:nth-child(3) {

            width: 38px;

            height: 38px;

            left: 7px;

            top: 35px;
        }


        .tree-1 {

            left: 43%;

            transform: scale(.78);

            opacity: .62;
        }


        .tree-2 {

            right: 16%;

            transform: scale(1.02);

            opacity: .82;
        }


        .tree-3 {

            right: -7px;

            transform: scale(1.18);

            opacity: .72;
        }


        .bg-ground {

            position: absolute;

            left: -10%;

            bottom: -36px;

            width: 120%;

            height: 88px;

            background: #cfeafa;

            border-radius:
                50% 50% 0 0;

            z-index: 3;
        }


        /* =========================================
           RESPONSIVE
        ========================================== */

        @media (max-width: 360px) {

            .bp-login-page {
                padding-top: 28px;
            }


            .bp-brand {
                font-size: 24px;
            }


            #loginForm {
                max-width: 100%;
            }


            .bp-bg-illustration {
                height: 205px;
            }


            .bg-house {

                transform: scale(.84);

                transform-origin:
                    bottom left;
            }


            .small-house {

                transform: scale(.78);

                transform-origin:
                    bottom left;
            }

        }


        @media (min-width: 431px) {

            .bp-bg-illustration {
                height: 250px;
            }

        }

    </style>

</head>


<body class="login-body">


<main class="login-app">


<section class="bp-login-page">


    <!-- =========================================
         LOGO
    ========================================== -->

    <div class="bp-logo">

        <div class="bp-house">

            <div class="bp-house-roof"></div>

            <div class="bp-house-body">

                <div class="bp-windows">

                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>

                </div>

                <div class="bp-door"></div>

            </div>

            <div class="bp-payment-card"></div>

        </div>


        <div class="bp-brand">
            Boarding<span>Pay</span>
        </div>


        <div class="bp-slogan">
            Manage. Pay. Stay.
        </div>

    </div>



    <!-- =========================================
         LOGIN FORM
    ========================================== -->

    <form id="loginForm">


        <!-- ACCOUNT TYPE -->

        <div class="bp-input">

            <span class="bp-icon">
                👤
            </span>

            <select
                id="role"
                required
                aria-label="Account Type"
            >

                <option value="">
                    Select Account Type
                </option>

                <option value="admin">
                    Admin
                </option>

                <option value="landlord">
                    Landlord
                </option>

                <option value="tenant">
                    Tenant
                </option>

            </select>

        </div>



        <!-- EMAIL / PHONE -->

        <div class="bp-input">

            <span class="bp-icon">
                ✉
            </span>

            <input
                type="text"
                id="loginIdentifier"
                placeholder="Email or Phone Number"
                autocomplete="username"
                required
            >

        </div>



        <!-- =====================================
             ROOM
        ====================================== -->

        <div id="roomGroup">

            <label
                for="roomSelect"
                class="room-label"
            >
                Select Room
            </label>


            <select
                id="roomSelect"
                aria-label="Select Room"
            >

                <option value="">
                    Select an available room
                </option>

            </select>


            <div id="roomInfo">
                Only available rooms are shown.
            </div>

        </div>



        <!-- PASSWORD -->

        <div class="bp-input">

            <span class="bp-icon">
                🔒
            </span>

            <input
                type="password"
                id="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button
                type="button"
                id="passwordToggle"
                class="bp-eye"
                aria-label="Show password"
            >
                ◉
            </button>

        </div>



        <!-- MESSAGE -->

        <div
            id="loginMessage"
            aria-live="polite"
        ></div>



        <!-- LOGIN -->

        <button
            type="submit"
            id="loginButton"
            class="bp-login-button"
        >
            Log In
        </button>



        <!-- FORGOT -->

        <a
            href="#"
            id="forgotPassword"
            class="bp-forgot"
        >
            Forgot Password?
        </a>



        <!-- CREATE ACCOUNT -->

        <div class="bp-create">

            Don't have an account?

            <a href="create-account.html">
                Create Account
            </a>

        </div>


    </form>



    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <div
        class="bp-bg-illustration"
        aria-hidden="true"
    >

        <div class="city city-1"></div>
        <div class="city city-2"></div>
        <div class="city city-3"></div>
        <div class="city city-4"></div>


        <div class="bg-house">

            <div class="bg-roof"></div>

            <div class="bg-house-body">

                <div class="bg-window bg-window-1"></div>

                <div class="bg-window bg-window-2"></div>

                <div class="bg-door"></div>

            </div>

        </div>


        <div class="small-house">

            <div class="small-roof"></div>

            <div class="small-body"></div>

        </div>


        <div class="tree tree-1">

            <span></span>
            <span></span>
            <span></span>

        </div>


        <div class="tree tree-2">

            <span></span>
            <span></span>
            <span></span>

        </div>


        <div class="tree tree-3">

            <span></span>
            <span></span>
            <span></span>

        </div>


        <div class="bg-ground"></div>

    </div>


</section>

</main>



<script>

/* =========================================================
   BOARDINGPAY LOGIN
   ROOM SELECTION VERSION
========================================================= */

(function () {

    "use strict";


    /* =====================================================
       STORAGE KEYS
    ===================================================== */

    const ACCOUNTS_KEY =
        "boardingPayAccounts";

    const CURRENT_USER_KEY =
        "boardingPayCurrentUser";

    const LOGGED_IN_KEY =
        "boardingPayLoggedIn";

    const ROOMS_KEY =
        "boardingPayRooms";


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const loginForm =
        document.getElementById(
            "loginForm"
        );

    const roleInput =
        document.getElementById(
            "role"
        );

    const identifierInput =
        document.getElementById(
            "loginIdentifier"
        );

    const passwordInput =
        document.getElementById(
            "password"
        );

    const passwordToggle =
        document.getElementById(
            "passwordToggle"
        );

    const message =
        document.getElementById(
            "loginMessage"
        );

    const forgotPassword =
        document.getElementById(
            "forgotPassword"
        );

    const roomGroup =
        document.getElementById(
            "roomGroup"
        );

    const roomSelect =
        document.getElementById(
            "roomSelect"
        );

    const roomInfo =
        document.getElementById(
            "roomInfo"
        );

    const loginButton =
        document.getElementById(
            "loginButton"
        );


    /* =====================================================
       NORMALIZE
    ===================================================== */

    function normalize(value) {

        return String(value || "")
            .trim()
            .toLowerCase();

    }


    /* =====================================================
       GET ACCOUNTS
    ===================================================== */

    function getAccounts() {

        try {

            const saved =
                localStorage.getItem(
                    ACCOUNTS_KEY
                );

            if (!saved) {
                return [];
            }

            const accounts =
                JSON.parse(saved);

            if (!Array.isArray(accounts)) {
                return [];
            }

            return accounts;

        }
        catch (error) {

            console.error(
                "Error reading accounts:",
                error
            );

            return [];

        }

    }


    /* =====================================================
       SAVE ACCOUNTS
    ===================================================== */

    function saveAccounts(accounts) {

        localStorage.setItem(
            ACCOUNTS_KEY,
            JSON.stringify(accounts)
        );

    }


    /* =====================================================
       GET ROOMS
    ===================================================== */

    function getRooms() {

        try {

            const saved =
                localStorage.getItem(
                    ROOMS_KEY
                );

            if (!saved) {
                return [];
            }

            const rooms =
                JSON.parse(saved);

            if (!Array.isArray(rooms)) {
                return [];
            }

            return rooms;

        }
        catch (error) {

            console.error(
                "Error reading rooms:",
                error
            );

            return [];

        }

    }


    /* =====================================================
       ROOM STATUS
    ===================================================== */

    function getRoomStatus(room) {

        return normalize(
            room.status ||
            room.roomStatus ||
            room.availability ||
            ""
        );

    }


    /* =====================================================
       CHECK IF ROOM IS AVAILABLE
    ===================================================== */

    function isRoomAvailable(room) {

        const status =
            getRoomStatus(room);

        /*
          Supported available values:
          available
          vacant
          empty
          open
        */

        return (
            status === "available" ||
            status === "vacant" ||
            status === "empty" ||
            status === "open"
        );

    }


    /* =====================================================
       GET ROOM ID
    ===================================================== */

    function getRoomId(room) {

        return String(
            room.id ||
            room.roomId ||
            room.roomNumber ||
            room.number ||
            ""
        );

    }


    /* =====================================================
       GET ROOM NUMBER
    ===================================================== */

    function getRoomNumber(room) {

        return String(
            room.roomNumber ||
            room.number ||
            room.name ||
            room.roomName ||
            getRoomId(room) ||
            "Room"
        );

    }


    /* =====================================================
       GET ROOM DISPLAY
    ===================================================== */

    function getRoomDisplay(room) {

        const roomNumber =
            getRoomNumber(room);

        const floor =
            room.floor ||
            room.floorNumber ||
            "";

        const price =
            room.price ||
            room.monthlyRent ||
            room.rent ||
            "";

        let text =
            "Room " + roomNumber;

        if (floor !== "") {

            text +=
                " - Floor " +
                floor;

        }

        if (price !== "") {

            text +=
                " - ₱" +
                Number(price).toLocaleString();

        }

        return text;

    }


    /* =====================================================
       GET AVAILABLE ROOMS
    ===================================================== */

    function getAvailableRooms() {

        const rooms =
            getRooms();

        return rooms.filter(
            function (room) {

                return isRoomAvailable(
                    room
                );

            }
        );

    }


    /* =====================================================
       SHOW MESSAGE
    ===================================================== */

    function showMessage(
        text,
        type
    ) {

        if (!message) {
            return;
        }

        message.textContent =
            text;

        message.className =
            type || "";

    }


    /* =====================================================
       SHOW / HIDE ROOM SELECTOR
    ===================================================== */

    function updateRoomVisibility() {

        const role =
            normalize(
                roleInput.value
            );


        /*
          ADMIN DOES NOT SELECT ROOM
        */

        if (
            role !== "tenant" &&
            role !== "landlord"
        ) {

            roomGroup.classList.remove(
                "show"
            );

            roomSelect.required =
                false;

            roomSelect.value = "";

            return;

        }


        /*
          TENANT / LANDLORD
          MUST SELECT ROOM
        */

        roomGroup.classList.add(
            "show"
        );

        roomSelect.required =
            true;


        loadAvailableRooms();

    }


    /* =====================================================
       LOAD AVAILABLE ROOMS
    ===================================================== */

    function loadAvailableRooms() {

        if (!roomSelect) {
            return;
        }


        roomSelect.innerHTML = "";


        const defaultOption =
            document.createElement(
                "option"
            );

        defaultOption.value = "";

        defaultOption.textContent =
            "Select an available room";

        roomSelect.appendChild(
            defaultOption
        );


        const availableRooms =
            getAvailableRooms();


        /*
          NO AVAILABLE ROOM
        */

        if (
            availableRooms.length === 0
        ) {

            const noRoomOption =
                document.createElement(
                    "option"
                );

            noRoomOption.value = "";

            noRoomOption.textContent =
                "No available rooms";

            noRoomOption.disabled =
                true;

            roomSelect.appendChild(
                noRoomOption
            );


            roomInfo.textContent =
                "There are currently no available rooms.";

            roomInfo.classList.add(
                "show"
            );

            return;

        }


        /*
          DISPLAY AVAILABLE ROOMS
        */

        availableRooms.forEach(
            function (room) {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    getRoomId(room);

                option.textContent =
                    getRoomDisplay(room);

                roomSelect.appendChild(
                    option
                );

            }
        );


        roomInfo.textContent =
            "Only available rooms are shown.";

        roomInfo.classList.add(
            "show"
        );

    }


    /* =====================================================
       FIND SELECTED ROOM
    ===================================================== */

    function findSelectedRoom(
        roomId
    ) {

        const rooms =
            getRooms();

        return rooms.find(
            function (room) {

                return (
                    getRoomId(room) ===
                    String(roomId)
                );

            }
        );

    }


    /* =====================================================
       REDIRECT BY ROLE
    ===================================================== */

    function redirectByRole(
        role
    ) {

        const normalizedRole =
            normalize(role);


        if (
            normalizedRole ===
            "admin"
        ) {

            window.location.replace(
                "admin-dashboard.html"
            );

            return;

        }


        if (
            normalizedRole ===
            "landlord"
        ) {

            window.location.replace(
                "landlord-dashboard.html"
            );

            return;

        }


        if (
            normalizedRole ===
            "tenant"
        ) {

            window.location.replace(
                "tenant-dashboard.html"
            );

            return;

        }


        showMessage(
            "Invalid account type.",
            "error"
        );

    }


    /* =====================================================
       PASSWORD SHOW / HIDE
    ===================================================== */

    if (
        passwordToggle &&
        passwordInput
    ) {

        passwordToggle.addEventListener(
            "click",
            function () {

                if (
                    passwordInput.type ===
                    "password"
                ) {

                    passwordInput.type =
                        "text";

                    passwordToggle.textContent =
                        "◉";

                    passwordToggle.setAttribute(
                        "aria-label",
                        "Hide password"
                    );

                }
                else {

                    passwordInput.type =
                        "password";

                    passwordToggle.textContent =
                        "◉";

                    passwordToggle.setAttribute(
                        "aria-label",
                        "Show password"
                    );

                }

            }
        );

    }


    /* =====================================================
       ROLE CHANGE
    ===================================================== */

    if (roleInput) {

        roleInput.addEventListener(
            "change",
            function () {

                showMessage(
                    "",
                    ""
                );

                updateRoomVisibility();

            }
        );

    }


    /* =====================================================
       LOAD PENDING LOGIN
    ===================================================== */

    function loadPendingLogin() {

        try {

            const pendingRole =
                localStorage.getItem(
                    "pendingLoginRole"
                );

            const pendingIdentifier =
                localStorage.getItem(
                    "pendingLoginIdentifier"
                );


            if (
                pendingRole &&
                roleInput
            ) {

                roleInput.value =
                    pendingRole;

            }


            if (
                pendingIdentifier &&
                identifierInput
            ) {

                identifierInput.value =
                    pendingIdentifier;

            }


            localStorage.removeItem(
                "pendingLoginRole"
            );

            localStorage.removeItem(
                "pendingLoginIdentifier"
            );


            updateRoomVisibility();

        }
        catch (error) {

            console.error(
                "Pending login error:",
                error
            );

        }

    }


    /* =====================================================
       LOGIN SUBMIT
    ===================================================== */

    if (loginForm) {

        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                showMessage(
                    "",
                    ""
                );


                /* =========================================
                   GET VALUES
                ========================================== */

                const selectedRole =
                    normalize(
                        roleInput.value
                    );

                const identifier =
                    normalize(
                        identifierInput.value
                    );

                const password =
                    passwordInput.value;


                /* =========================================
                   CHECK ROLE
                ========================================== */

                if (!selectedRole) {

                    showMessage(
                        "Please select your account type.",
                        "error"
                    );

                    roleInput.focus();

                    return;

                }


                /* =========================================
                   CHECK IDENTIFIER
                ========================================== */

                if (!identifier) {

                    showMessage(
                        "Please enter your email or phone number.",
                        "error"
                    );

                    identifierInput.focus();

                    return;

                }


                /* =========================================
                   CHECK PASSWORD
                ========================================== */

                if (!password) {

                    showMessage(
                        "Please enter your password.",
                        "error"
                    );

                    passwordInput.focus();

                    return;

                }


                /* =========================================
                   ROOM REQUIRED FOR
                   TENANT AND LANDLORD
                ========================================== */

                let selectedRoom =
                    null;


                if (
                    selectedRole ===
                    "tenant" ||
                    selectedRole ===
                    "landlord"
                ) {

                    const roomId =
                        String(
                            roomSelect.value ||
                            ""
                        );


                    if (!roomId) {

                        showMessage(
                            "Please select an available room.",
                            "error"
                        );

                        roomSelect.focus();

                        return;

                    }


                    selectedRoom =
                        findSelectedRoom(
                            roomId
                        );


                    /*
                      ROOM MUST EXIST
                    */

                    if (!selectedRoom) {

                        showMessage(
                            "The selected room is no longer available.",
                            "error"
                        );

                        loadAvailableRooms();

                        return;

                    }


                    /*
                      ROOM MUST STILL BE AVAILABLE
                    */

                    if (
                        !isRoomAvailable(
                            selectedRoom
                        )
                    ) {

                        showMessage(
                            "The selected room is no longer available. Please select another room.",
                            "error"
                        );

                        loadAvailableRooms();

                        return;

                    }

                }


                /* =========================================
                   GET ACCOUNTS
                ========================================== */

                const accounts =
                    getAccounts();


                /* =========================================
                   FIND ACCOUNT
                   EMAIL / PHONE / USERNAME / IDENTIFIER
                ========================================== */

                const account =
                    accounts.find(
                        function (item) {

                            const accountRole =
                                normalize(
                                    item.role ||
                                    item.accountType
                                );


                            const email =
                                normalize(
                                    item.email
                                );


                            const itemIdentifier =
                                normalize(
                                    item.identifier
                                );


                            const phone =
                                normalize(
                                    item.phone
                                );


                            const username =
                                normalize(
                                    item.username
                                );


                            const identifierMatch =

                                email ===
                                identifier ||

                                itemIdentifier ===
                                identifier ||

                                phone !== "" &&
                                phone === identifier ||

                                username !== "" &&
                                username === identifier;


                            const roleMatch =
                                accountRole ===
                                selectedRole;


                            return (
                                identifierMatch &&
                                roleMatch
                            );

                        }
                    );


                /* =========================================
                   ACCOUNT NOT FOUND
                ========================================== */

                if (!account) {

                    /*
                      Check if account exists
                      but role is wrong.
                    */

                    const accountExists =
                        accounts.some(
                            function (item) {

                                const email =
                                    normalize(
                                        item.email
                                    );

                                const itemIdentifier =
                                    normalize(
                                        item.identifier
                                    );

                                const phone =
                                    normalize(
                                        item.phone
                                    );

                                const username =
                                    normalize(
                                        item.username
                                    );


                                return (
                                    email === identifier ||
                                    itemIdentifier === identifier ||
                                    (
                                        phone !== "" &&
                                        phone === identifier
                                    ) ||
                                    (
                                        username !== "" &&
                                        username === identifier
                                    )
                                );

                            }
                        );


                    if (accountExists) {

                        showMessage(
                            "Incorrect account type. Please select the role used when you registered.",
                            "error"
                        );

                        roleInput.focus();

                    }
                    else {

                        showMessage(
                            "Account not found. Please create an account first.",
                            "error"
                        );

                    }

                    return;

                }


                /* =========================================
                   CHECK PASSWORD
                ========================================== */

                if (
                    String(
                        account.password ||
                        ""
                    ) !==
                    String(
                        password
                    )
                ) {

                    showMessage(
                        "Incorrect password.",
                        "error"
                    );

                    passwordInput.focus();

                    return;

                }


                /* =========================================
                   CREATE CURRENT USER
                ========================================== */

                const currentUser = {

                    id:
                        account.id ||
                        "",

                    fullName:
                        account.fullName ||
                        "",

                    username:
                        account.username ||
                        "",

                    identifier:
                        account.identifier ||
                        account.email ||
                        account.phone ||
                        "",

                    email:
                        account.email ||
                        "",

                    phone:
                        account.phone ||
                        "",

                    password:
                        account.password ||
                        "",

                    role:
                        selectedRole,

                    accountType:
                        account.accountType ||
                        (
                            selectedRole ===
                            "admin"
                                ? "Admin"
                                :
                            selectedRole ===
                            "landlord"
                                ? "Landlord"
                                :
                            "Tenant"
                        ),

                    /*
                      ROOM INFORMATION
                    */

                    roomId:
                        selectedRoom
                            ? getRoomId(
                                selectedRoom
                            )
                            : "",

                    roomNumber:
                        selectedRoom
                            ? getRoomNumber(
                                selectedRoom
                            )
                            : "",

                    room:
                        selectedRoom
                            ? selectedRoom
                            : null

                };


                /* =========================================
                   SAVE CURRENT USER
                ========================================== */

                localStorage.setItem(
                    CURRENT_USER_KEY,
                    JSON.stringify(
                        currentUser
                    )
                );


                /*
                  Additional compatibility keys
                */

                localStorage.setItem(
                    "currentUser",
                    JSON.stringify(
                        currentUser
                    )
                );

                localStorage.setItem(
                    "loggedInUser",
                    JSON.stringify(
                        currentUser
                    )
                );


                /* =========================================
                   LOGIN STATUS
                ========================================== */

                localStorage.setItem(
                    LOGGED_IN_KEY,
                    "true"
                );

                localStorage.setItem(
                    "isLoggedIn",
                    "true"
                );

                localStorage.setItem(
                    "loggedIn",
                    "true"
                );


                /* =========================================
                   USER INFORMATION
                ========================================== */

                localStorage.setItem(
                    "currentUserType",
                    selectedRole
                );

                localStorage.setItem(
                    "userRole",
                    selectedRole
                );

                localStorage.setItem(
                    "accountType",
                    selectedRole
                );

                localStorage.setItem(
                    "loggedInName",
                    currentUser.fullName
                );

                localStorage.setItem(
                    "loggedInEmail",
                    currentUser.email
                );

                localStorage.setItem(
                    "loggedInPhone",
                    currentUser.phone
                );


                /* =========================================
                   ROOM SESSION INFORMATION
                ========================================== */

                if (
                    selectedRoom
                ) {

                    localStorage.setItem(
                        "currentRoom",
                        JSON.stringify(
                            selectedRoom
                        )
                    );

                    localStorage.setItem(
                        "currentRoomId",
                        getRoomId(
                            selectedRoom
                        )
                    );

                    localStorage.setItem(
                        "currentRoomNumber",
                        getRoomNumber(
                            selectedRoom
                        )
                    );

                }
                else {

                    localStorage.removeItem(
                        "currentRoom"
                    );

                    localStorage.removeItem(
                        "currentRoomId"
                    );

                    localStorage.removeItem(
                        "currentRoomNumber"
                    );

                }


                /* =========================================
                   ROLE-SPECIFIC SESSION
                ========================================== */

                if (
                    selectedRole ===
                    "admin"
                ) {

                    localStorage.setItem(
                        "currentAdmin",
                        JSON.stringify(
                            currentUser
                        )
                    );

                }


                if (
                    selectedRole ===
                    "landlord"
                ) {

                    localStorage.setItem(
                        "currentLandlord",
                        JSON.stringify(
                            currentUser
                        )
                    );

                }


                if (
                    selectedRole ===
                    "tenant"
                ) {

                    localStorage.setItem(
                        "currentTenant",
                        JSON.stringify(
                            currentUser
                        )
                    );

                }


                /* =========================================
                   UPDATE ACCOUNT WITH SELECTED ROOM
                ========================================== */

                if (
                    selectedRoom &&
                    (
                        selectedRole ===
                        "tenant" ||
                        selectedRole ===
                        "landlord"
                    )
                ) {

                    const updatedAccounts =
                        getAccounts();


                    const accountIndex =
                        updatedAccounts.findIndex(
                            function (item) {

                                return (
                                    String(
                                        item.id ||
                                        ""
                                    ) ===
                                    String(
                                        account.id ||
                                        ""
                                    )
                                );

                            }
                        );


                    if (
                        accountIndex !==
                        -1
                    ) {

                        updatedAccounts[
                            accountIndex
                        ].roomId =
                            getRoomId(
                                selectedRoom
                            );

                        updatedAccounts[
                            accountIndex
                        ].roomNumber =
                            getRoomNumber(
                                selectedRoom
                            );

                        updatedAccounts[
                            accountIndex
                        ].room =
                            selectedRoom;


                        saveAccounts(
                            updatedAccounts
                        );

                    }

                }


                /* =========================================
                   SUCCESS MESSAGE
                ========================================== */

                showMessage(
                    "Login successful. Opening dashboard...",
                    "success"
                );


                if (loginButton) {

                    loginButton.disabled =
                        true;

                    loginButton.textContent =
                        "Opening...";

                }


                /* =========================================
                   REDIRECT
                ========================================== */

                setTimeout(
                    function () {

                        redirectByRole(
                            selectedRole
                        );

                    },
                    300
                );

            }
        );

    }


    /* =====================================================
       FORGOT PASSWORD
    ===================================================== */

    if (
        forgotPassword
    ) {

        forgotPassword.addEventListener(
            "click",
            function (event) {

                event.preventDefault();

                showMessage(
                    "Please contact the system administrator to reset your password.",
                    "error"
                );

            }
        );

    }


    /* =====================================================
       INITIALIZE
    ===================================================== */

    loadPendingLogin();

    updateRoomVisibility();


})();   

</script>
