<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>BoardingPay - Forgot Password</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            font-family: Arial, Helvetica, sans-serif;
            color: #123f68;
            overflow-x: hidden;
        }

        .app {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;
            background: #ffffff;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 35px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 32px;
        }

        .house {
            position: relative;
            width: 82px;
            height: 62px;
            margin-bottom: 3px;
        }

        .roof {
            position: absolute;
            width: 51px;
            height: 51px;
            left: 13px;
            top: 7px;

            border-left: 6px solid #064b88;
            border-top: 6px solid #064b88;

            transform: rotate(45deg);
            border-radius: 3px;
        }

        .house-body {
            position: absolute;
            width: 51px;
            height: 39px;
            left: 13px;
            top: 24px;

            background: #ffffff;

            border-left: 5px solid #064b88;
            border-right: 5px solid #064b88;
            border-bottom: 5px solid #064b88;
        }

        .windows {
            position: absolute;
            left: 11px;
            top: 8px;

            width: 19px;
            height: 19px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 2px;
        }

        .windows span {
            background: #18a2df;
            border-radius: 1px;
        }

        .door {
            position: absolute;
            width: 10px;
            height: 19px;

            right: 5px;
            bottom: 0;

            background: #064b88;

            border-radius: 2px 2px 0 0;
        }

        .payment-card {
            position: absolute;
            width: 35px;
            height: 23px;

            background: #078bd5;
            border-radius: 3px;

            right: 3px;
            top: 34px;

            transform: rotate(-5deg);

            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.12);
        }

        .payment-card::before {
            content: "";

            position: absolute;
            left: 6px;
            top: 5px;

            width: 23px;
            height: 3px;

            background: #ffffff;
            border-radius: 2px;
        }

        .payment-card::after {
            content: "";

            position: absolute;
            left: 7px;
            bottom: 5px;

            width: 14px;
            height: 3px;

            background: #ffffff;
            border-radius: 2px;
        }

        .brand {
            font-size: 26px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -1.2px;
            color: #073f78;
        }

        .brand span {
            color: #078bd5;
        }

        /* =========================
           CONTENT
        ========================= */

        .forgot-container {
            width: 100%;
            max-width: 365px;
        }

        .title {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            color: #073f78;
            margin-bottom: 8px;
        }

        .description {
            text-align: center;
            color: #7893a5;
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        /* =========================
           INPUT
        ========================= */

        .input-box {
            width: 100%;
            height: 46px;

            display: flex;
            align-items: center;

            background: #f8fcfe;
            border: 1px solid #d7e6ee;
            border-radius: 8px;

            margin-bottom: 12px;
            overflow: hidden;
        }

        .input-box:focus-within {
            background: #ffffff;
            border-color: #1594d8;
            box-shadow: 0 0 0 2px rgba(21, 148, 216, 0.08);
        }

        .input-icon {
            width: 42px;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #7595aa;
            font-size: 17px;

            flex-shrink: 0;
        }

        .input-box input {
            flex: 1;

            width: 100%;
            height: 100%;

            border: none;
            outline: none;
            background: transparent;

            padding-right: 10px;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 13px;

            color: #163e61;
        }

        .input-box input::placeholder {
            color: #9aacb8;
        }

        /* =========================
           MESSAGE
        ========================= */

        #message {
            min-height: 18px;

            text-align: center;

            font-size: 11px;
            line-height: 1.4;

            margin-bottom: 7px;
        }

        #message.error {
            color: #d93025;
        }

        #message.success {
            color: #188038;
        }

        /* =========================
           BUTTON
        ========================= */

        .send-button {
            width: 100%;
            height: 44px;

            border: none;
            border-radius: 8px;

            background: #168fd4;
            color: #ffffff;

            font-size: 13px;
            font-weight: 700;

            font-family: Arial, Helvetica, sans-serif;

            cursor: pointer;

            box-shadow: 0 2px 5px rgba(8, 125, 204, 0.15);

            transition: 0.2s ease;
        }

        .send-button:hover {
            background: #087dcc;
        }

        .send-button:active {
            transform: scale(0.985);
        }

        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {
            width: 100%;
            height: 42px;

            margin-top: 12px;

            border: 1px solid #d7e6ee;
            border-radius: 8px;

            background: #ffffff;
            color: #078bd5;

            font-size: 13px;
            font-weight: 700;

            font-family: Arial, Helvetica, sans-serif;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 7px;

            text-decoration: none;

            transition: 0.2s ease;
        }

        .back-button:hover {
            background: #f3faff;
            border-color: #1594d8;
            color: #087dcc;
        }

        .back-button:active {
            transform: scale(0.985);
        }

        /* =========================
           RESET PASSWORD SECTION
        ========================= */

        #resetSection {
            display: none;
        }

        .reset-title {
            text-align: center;

            font-size: 20px;
            font-weight: 800;

            color: #073f78;

            margin-bottom: 8px;
        }

        .reset-description {
            text-align: center;

            font-size: 12px;
            color: #7893a5;

            line-height: 1.5;

            margin-bottom: 20px;
        }

        @media (max-width: 360px) {
            .page {
                padding-top: 28px;
            }

            .brand {
                font-size: 24px;
            }
        }

        @media (min-width: 431px) {
            body {
                background: #e8f3f8;
            }

            .app {
                box-shadow: 0 0 35px rgba(20, 70, 100, 0.12);
            }
        }
    </style>
</head>

<body>

<div class="app">

    <main class="page">

        <!-- LOGO -->
        <div class="logo">

            <div class="house">

                <div class="roof"></div>

                <div class="house-body">

                    <div class="windows">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="door"></div>

                </div>

                <div class="payment-card"></div>

            </div>

            <div class="brand">
                Boarding<span>Pay</span>
            </div>

        </div>


        <!-- FORGOT PASSWORD -->
        <div class="forgot-container" id="forgotSection">

            <h1 class="title">
                Forgot Password?
            </h1>

            <p class="description">
                Enter your registered email or phone number
                to reset your password.
            </p>

            <form id="forgotForm">

                <div class="input-box">

                    <span class="input-icon">
                        ✉
                    </span>

                    <input
                        type="text"
                        id="identifier"
                        placeholder="Email or Phone Number"
                        autocomplete="off"
                    >

                </div>

                <div id="message"></div>

                <button
                    type="submit"
                    class="send-button"
                >
                    Continue
                </button>

            </form>

            <a
                href="login.html"
                class="back-button"
            >
                ← Back to Login
            </a>

        </div>


        <!-- RESET PASSWORD -->
        <div
            class="forgot-container"
            id="resetSection"
        >

            <h1 class="reset-title">
                Reset Password
            </h1>

            <p class="reset-description">
                Create a new password for your account.
            </p>

            <form id="resetForm">

                <div class="input-box">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="New Password"
                    >

                </div>

                <div class="input-box">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm New Password"
                    >

                </div>

                <div id="resetMessage"></div>

                <button
                    type="submit"
                    class="send-button"
                >
                    Reset Password
                </button>

            </form>

        </div>

    </main>

</div>


<script>

document.addEventListener("DOMContentLoaded", function () {

    const forgotForm =
        document.getElementById("forgotForm");

    const identifier =
        document.getElementById("identifier");

    const message =
        document.getElementById("message");

    const forgotSection =
        document.getElementById("forgotSection");

    const resetSection =
        document.getElementById("resetSection");

    const resetForm =
        document.getElementById("resetForm");

    const newPassword =
        document.getElementById("newPassword");

    const confirmPassword =
        document.getElementById("confirmPassword");

    const resetMessage =
        document.getElementById("resetMessage");


    /*
    =====================================================
    FIND REGISTERED ACCOUNT
    =====================================================
    */

    let foundUserType = "";


    if (forgotForm) {

        forgotForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                const value =
                    identifier.value.trim();

                message.textContent = "";
                message.className = "";

                if (value === "") {

                    message.textContent =
                        "Please enter your email or phone number.";

                    message.className = "error";

                    return;
                }


                /*
                ============================
                TENANT
                ============================
                */

                const tenantEmail =
                    localStorage.getItem("tenantEmail") || "";

                const tenantPhone =
                    localStorage.getItem("tenantPhone") || "";


                const tenantMatch =
                    (
                        tenantEmail &&
                        value.toLowerCase() ===
                        tenantEmail.toLowerCase()
                    )
                    ||
                    (
                        tenantPhone &&
                        value === tenantPhone
                    );


                if (tenantMatch) {

                    foundUserType = "tenant";

                }


                /*
                ============================
                LANDLORD
                ============================
                */

                if (!foundUserType) {

                    const landlordEmail =
                        localStorage.getItem("landlordEmail") || "";

                    const landlordPhone =
                        localStorage.getItem("landlordPhone") || "";


                    const landlordMatch =
                        (
                            landlordEmail &&
                            value.toLowerCase() ===
                            landlordEmail.toLowerCase()
                        )
                        ||
                        (
                            landlordPhone &&
                            value === landlordPhone
                        );


                    if (landlordMatch) {

                        foundUserType = "landlord";

                    }

                }


                /*
                ============================
                ADMIN
                ============================
                */

                if (!foundUserType) {

                    const adminEmail =
                        localStorage.getItem("adminEmail") || "";

                    const adminPhone =
                        localStorage.getItem("adminPhone") || "";


                    const adminMatch =
                        (
                            adminEmail &&
                            value.toLowerCase() ===
                            adminEmail.toLowerCase()
                        )
                        ||
                        (
                            adminPhone &&
                            value === adminPhone
                        );


                    if (adminMatch) {

                        foundUserType = "admin";

                    }

                }


                /*
                ============================
                ACCOUNT NOT FOUND
                ============================
                */

                if (!foundUserType) {

                    message.textContent =
                        "No registered account was found.";

                    message.className = "error";

                    return;

                }


                /*
                ============================
                ACCOUNT FOUND
                ============================
                */

                message.textContent =
                    "Account found. You can now create a new password.";

                message.className = "success";


                setTimeout(function () {

                    forgotSection.style.display = "none";

                    resetSection.style.display = "block";

                }, 700);

            }
        );

    }


    /*
    =====================================================
    RESET PASSWORD
    =====================================================
    */

    if (resetForm) {

        resetForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                const password =
                    newPassword.value;

                const confirm =
                    confirmPassword.value;


                resetMessage.textContent = "";
                resetMessage.className = "";


                /*
                ============================
                VALIDATION
                ============================
                */

                if (
                    password === "" ||
                    confirm === ""
                ) {

                    resetMessage.textContent =
                        "Please complete both password fields.";

                    resetMessage.className =
                        "error";

                    return;

                }


                if (password.length < 6) {

                    resetMessage.textContent =
                        "Password must be at least 6 characters.";

                    resetMessage.className =
                        "error";

                    return;

                }


                if (password !== confirm) {

                    resetMessage.textContent =
                        "Passwords do not match.";

                    resetMessage.className =
                        "error";

                    return;

                }


                /*
                ============================
                SAVE NEW PASSWORD
                ============================
                */

                if (foundUserType === "tenant") {

                    localStorage.setItem(
                        "tenantPassword",
                        password
                    );

                }


                if (foundUserType === "landlord") {

                    localStorage.setItem(
                        "landlordPassword",
                        password
                    );

                }


                if (foundUserType === "admin") {

                    localStorage.setItem(
                        "adminPassword",
                        password
                    );

                }


                resetMessage.textContent =
                    "Password reset successfully!";

                resetMessage.className =
                    "success";


                /*
                ============================
                GO BACK TO LOGIN
                ============================
                */

                setTimeout(function () {

                    window.location.href =
                        "login.html";

                }, 1000);

            }
        );

    }

});

</script>

</body>
</html>
