<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Payment History - BoardingPay</title>

    <style>

        * {
            box-sizing: border-box;

            margin: 0;

            padding: 0;
        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #ffffff;

            color: #173b63;
        }


        .history-page {

            max-width: 430px;

            min-height: 100vh;

            margin: auto;

            background: #ffffff;

            padding-bottom: 80px;
        }


        /* =========================
           HEADER
        ========================= */

        .history-header {

            height: 58px;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;

            border-bottom:
                1px solid #edf1f4;
        }


        .history-header h1 {

            font-size: 15px;

            color: #173b63;
        }


        /* BACK */

        .back-btn {

            position: absolute;

            left: 12px;

            width: 35px;

            height: 35px;

            border: none;

            background: transparent;

            color: #657786;

            font-size: 28px;

            cursor: pointer;
        }


        /* =========================
           HISTORY LIST
        ========================= */

        .history-list {

            padding: 12px;
        }


        /* PAYMENT */

        .payment-card {

            display: flex;

            align-items: center;

            gap: 10px;

            padding:
                13px 10px;

            border:
                1px solid #e5edf2;

            border-radius: 8px;

            margin-bottom: 8px;

            box-shadow:
                0 2px 6px #eef3f6;

            cursor: pointer;

            background: #ffffff;
        }


        .payment-card:hover {

            background: #f8fcff;
        }


        /* CHECK */

        .check {

            width: 32px;

            height: 32px;

            border-radius: 50%;

            background: #20b77a;

            color: #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;

            flex-shrink: 0;
        }


        /* INFO */

        .payment-info {

            flex: 1;
        }


        .payment-info strong {

            display: block;

            font-size: 12px;
        }


        .payment-info span {

            display: block;

            font-size: 10px;

            color: #84939d;

            margin-top: 3px;
        }


        /* AMOUNT */

        .amount {

            text-align: right;
        }


        .amount strong {

            display: block;

            font-size: 12px;

            color: #159c75;
        }


        .amount span {

            font-size: 9px;

            color: #20a97a;
        }


        /* =========================
           RECEIPT
        ========================= */

        .receipt {

            display: none;

            margin-top: 16px;

            padding: 18px;

            border:
                1px solid #dfe9ef;

            border-radius: 8px;

            box-shadow:
                0 3px 10px #edf2f5;

            background: #ffffff;
        }


        .receipt.show {

            display: block;
        }


        .receipt-title {

            text-align: center;

            color: #20a97a;

            font-size: 15px;

            font-weight: bold;

            margin-bottom: 15px;
        }


        .receipt-row {

            display: flex;

            justify-content:
                space-between;

            gap: 10px;

            padding: 10px 0;

            border-bottom:
                1px solid #edf1f4;

            font-size: 11px;
        }


        .receipt-row span {

            color: #71818c;
        }


        .receipt-row strong {

            color: #173b63;

            text-align: right;
        }


        .receipt-status {

            color:
                #20a97a !important;
        }


        /* EMPTY */

        .empty {

            text-align: center;

            color: #84939d;

            font-size: 12px;

            padding: 45px 20px;
        }


        /* =========================
           BOTTOM NAV
        ========================= */

        .bottom-navigation {

            position: fixed;

            left: 50%;

            bottom: 0;

            transform:
                translateX(-50%);

            width: 100%;

            max-width: 430px;

            height: 62px;

            background: #ffffff;

            border-top:
                1px solid #dce6ed;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            z-index: 1000;
        }


        .nav-item {

            border: none;

            background: transparent;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 3px;

            color: #7c8b97;

            cursor: pointer;
        }


        .nav-item.active {

            color: #078bd0;

            font-weight: bold;
        }


        .nav-icon {

            font-size: 17px;
        }


        .nav-label {

            font-size: 8px;
        }

    </style>

</head>


<body>


<main class="history-page">


    <!-- HEADER -->

    <header class="history-header">

        <button
            type="button"
            class="back-btn"
            id="historyBackBtn">

            ‹

        </button>

        <h1>
            Payment History
        </h1>

    </header>


    <!-- HISTORY -->

    <section
        class="history-list"
        id="historyList">

    </section>


</main>


<!-- =========================
     BOTTOM NAV
========================= -->

<nav class="bottom-navigation">


    <!-- HOME -->

    <button
        type="button"
        class="nav-item"
        id="navHome">

        <span class="nav-icon">
            ⌂
        </span>

        <span class="nav-label">
            Home
        </span>

    </button>


    <!-- PAYMENT -->

    <button
        type="button"
        class="nav-item"
        id="navPayment">

        <span class="nav-icon">
            ▣
        </span>

        <span class="nav-label">
            Payment
        </span>

    </button>


    <!-- HISTORY -->

    <button
        type="button"
        class="nav-item active"
        id="navHistory">

        <span class="nav-icon">
            ◷
        </span>

        <span class="nav-label">
            History
        </span>

    </button>


    <!-- PROFILE -->

    <button
        type="button"
        class="nav-item"
        id="navProfile">

        <span class="nav-icon">
            ♙
        </span>

        <span class="nav-label">
            Profile
        </span>

    </button>


</nav>


<script>

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const historyList =
            document.getElementById(
                "historyList"
            );


        const history =
            JSON.parse(
                localStorage.getItem(
                    "paymentHistory"
                ) || "[]"
            );


        /* =========================
           NO HISTORY
        ========================= */

        if (
            history.length === 0
        ) {

            historyList.innerHTML = `

                <div class="empty">

                    No Payment History yet.

                </div>

            `;

        }


        /* =========================
           DISPLAY HISTORY
        ========================= */

        else {

            historyList.innerHTML =
                history
                    .map(
                        function (
                            payment,
                            index
                        ) {

                            return `

                                <div
                                    class="payment-card"
                                    data-index="${index}">

                                    <div class="check">

                                        ✓

                                    </div>


                                    <div
                                        class="payment-info">

                                        <strong>

                                            ${payment.description}

                                        </strong>

                                        <span>

                                            ${payment.date}
                                            •
                                            ${payment.method}

                                        </span>

                                    </div>


                                    <div
                                        class="amount">

                                        <strong>

                                            ₱
                                            ${Number(
                                                payment.amount
                                            ).toLocaleString(
                                                "en-PH",
                                                {
                                                    minimumFractionDigits:
                                                        2
                                                }
                                            )}

                                        </strong>

                                        <span>

                                            ${payment.status}

                                        </span>

                                    </div>

                                </div>

                            `;

                        }
                    )
                    .join("");


            /* =========================
               CLICK PAYMENT
            ========================= */

            document
                .querySelectorAll(
                    ".payment-card"
                )
                .forEach(
                    function (card) {

                        card.addEventListener(
                            "click",
                            function () {

                                const index =
                                    Number(
                                        this.dataset
                                            .index
                                    );


                                const payment =
                                    history[index];


                                showReceipt(
                                    payment
                                );

                            }
                        );

                    }
                );

        }


        /* =========================
           RECEIPT
        ========================= */

        function showReceipt(
            payment
        ) {


            const oldReceipt =
                document.getElementById(
                    "paymentReceipt"
                );


            if (oldReceipt) {

                oldReceipt.remove();

            }


            const receipt =
                document.createElement(
                    "div"
                );


            receipt.id =
                "paymentReceipt";


            receipt.className =
                "receipt show";


            receipt.innerHTML = `

                <div class="receipt-title">

                    ✓ Payment Receipt

                </div>


                <div class="receipt-row">

                    <span>
                        Receipt No.
                    </span>

                    <strong>
                        ${payment.id}
                    </strong>

                </div>


                <div class="receipt-row">

                    <span>
                        Room
                    </span>

                    <strong>
                        ${payment.room}
                    </strong>

                </div>


                <div class="receipt-row">

                    <span>
                        Payment
                    </span>

                    <strong>
                        ${payment.description}
                    </strong>

                </div>


                <div class="receipt-row">

                    <span>
                        Payment Method
                    </span>

                    <strong>
                        ${payment.method}
                    </strong>

                </div>


                <div class="receipt-row">

                    <span>
                        Amount
                    </span>

                    <strong>

                        ₱
                        ${Number(
                            payment.amount
                        ).toLocaleString(
                            "en-PH",
                            {
                                minimumFractionDigits:
                                    2
                            }
                        )}

                    </strong>

                </div>


                <div class="receipt-row">

                    <span>
                        Due Date
                    </span>

                    <strong>
                        ${payment.dueDate}
                    </strong>

                </div>


                <div class="receipt-row">

                    <span>
                        Paid Date
                    </span>

                    <strong>
                        ${payment.date}
                    </strong>

                </div>


                <div class="receipt-row">

                    <span>
                        Status
                    </span>

                    <strong
                        class="receipt-status">

                        ${payment.status}

                    </strong>

                </div>

            `;


            historyList.appendChild(
                receipt
            );


            receipt.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

        }


        /* =========================
           BACK TO DASHBOARD
        ========================= */

        document
            .getElementById(
                "historyBackBtn"
            )
            .onclick =
            function () {

                window.location.href =
                    "tenant-dashboard.html";

            };


        /* =========================
           NAVIGATION
        ========================= */

        document
            .getElementById(
                "navHome"
            )
            .onclick =
            function () {

                window.location.href =
                    "tenant-dashboard.html";

            };


        document
            .getElementById(
                "navPayment"
            )
            .onclick =
            function () {

                window.location.href =
                    "paymentmethod.html";

            };


        document
            .getElementById(
                "navHistory"
            )
            .onclick =
            function () {

                window.location.href =
                    "history.html";

            };


        document
            .getElementById(
                "navProfile"
            )
            .onclick =
            function () {

                window.location.href =
                    "profile.html";

            };

    }
);

</script>


</body>

</html>
