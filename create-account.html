<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - BoardingPay</title>

    <link
        rel="stylesheet"
        href="./style.css?v=21"
    >

    <style>

        .account-card {
            cursor: pointer;
            transition:
                transform 0.15s ease,
                box-shadow 0.15s ease;
        }

        .account-card:hover {
            transform: translateY(-2px);
        }

        .account-card:active {
            transform: scale(0.98);
        }

    </style>

</head>


<body>


<main class="app registration-page">


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="registration-header">

        <button
            type="button"
            id="backBtn"
            class="back-btn"
            aria-label="Back"
        >
            ‹
        </button>


        <div class="header-title">

            <h1>
                Create Account
            </h1>

            <p>
                Choose your account type
            </p>

        </div>

    </header>



    <!-- =========================================
         ACCOUNT TYPES
    ========================================== -->

    <section class="account-types">


        <!-- TENANT -->

        <button
            type="button"
            id="tenantBtn"
            class="account-card"
        >

            <div class="account-icon tenant-icon">

                <span>
                    ●
                </span>

            </div>


            <div class="account-info">

                <h2>
                    Tenant
                </h2>

                <p>
                    Manage your room, payments,
                    and stay easily.
                </p>

            </div>


            <span class="arrow">
                ›
            </span>

        </button>



        <!-- LANDLORD -->

        <button
            type="button"
            id="landlordBtn"
            class="account-card"
        >

            <div class="account-icon landlord-icon">

                <span>
                    ⌂
                </span>

            </div>


            <div class="account-info">

                <h2>
                    Landlord
                </h2>

                <p>
                    Manage your rooms, tenants,
                    and payments.
                </p>

            </div>


            <span class="arrow">
                ›
            </span>

        </button>



        <!-- ADMIN -->

        <button
            type="button"
            id="adminBtn"
            class="account-card"
        >

            <div class="account-icon admin-icon">

                <span>
                    ⚙
                </span>

            </div>


            <div class="account-info">

                <h2>
                    Admin
                </h2>

                <p>
                    Manage users and system
                    administration.
                </p>

            </div>


            <span class="arrow">
                ›
            </span>

        </button>


    </section>


</main>



<script>

(function () {

    "use strict";


    /* =========================================
       ELEMENTS
    ========================================== */

    const backBtn =
        document.getElementById("backBtn");

    const tenantBtn =
        document.getElementById("tenantBtn");

    const landlordBtn =
        document.getElementById("landlordBtn");

    const adminBtn =
        document.getElementById("adminBtn");



    /* =========================================
       BACK TO LOGIN
    ========================================== */

    if (backBtn) {

        backBtn.addEventListener(
            "click",
            function () {

                window.location.href =
                    "login.html";

            }
        );

    }



    /* =========================================
       TENANT
    ========================================== */

    if (tenantBtn) {

        tenantBtn.addEventListener(
            "click",
            function () {

                window.location.href =
                    "tenant-register.html";

            }
        );

    }



    /* =========================================
       LANDLORD
    ========================================== */

    if (landlordBtn) {

        landlordBtn.addEventListener(
            "click",
            function () {

                window.location.href =
                    "landlord-register.html";

            }
        );

    }



    /* =========================================
       ADMIN
    ========================================== */

    if (adminBtn) {

        adminBtn.addEventListener(
            "click",
            function () {

                window.location.href =
                    "admin-register.html";

            }
        );

    }


})();

</script>


</body>
</html>
