<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BoardingPay</title>

    <link rel="stylesheet" href="./style.css?v=6">
</head>

<body>

    <main class="app index-page">

        <!-- ================================
             BRAND / LOGO
        ================================= -->

        <section class="index-brand">

            <div class="boarding-logo">

                <!-- HOUSE -->
                <div class="boarding-house">

                    <div class="house-roof"></div>

                    <div class="house-body">

                        <div class="house-window left"></div>

                        <div class="house-window right"></div>

                        <div class="house-door"></div>

                    </div>

                </div>


                <!-- PAYMENT CARD -->
                <div class="boarding-card">

                    <span></span>
                    <span></span>

                </div>

            </div>


            <h1>
                Boarding<span>Pay</span>
            </h1>


            <p>
                Manage. Pay. Stay.
            </p>

        </section>



        <!-- ================================
             CITY / HOUSE ILLUSTRATION
        ================================= -->

        <section class="index-illustration">

            <!-- CITY -->
            <div class="index-building building-a"></div>

            <div class="index-building building-b"></div>

            <div class="index-building building-c"></div>

            <div class="index-building building-d"></div>


            <!-- HOUSE -->
            <div class="index-main-house">

                <div class="index-roof"></div>

                <div class="index-house-body">

                    <div class="index-window left"></div>

                    <div class="index-window right"></div>

                    <div class="index-door"></div>

                </div>

            </div>


            <!-- SMALL HOUSE -->
            <div class="index-small-house">

                <div class="small-roof"></div>

                <div class="small-body"></div>

            </div>


            <!-- GROUND -->
            <div class="index-ground"></div>

        </section>



        <!-- ================================
             BUTTONS
        ================================= -->

        <section class="index-buttons">

            <button
                type="button"
                id="getStartedBtn"
                class="index-btn index-primary">

                Get Started

            </button>


            <button
                type="button"
                id="loginBtn"
                class="index-btn index-secondary">

                Log In

            </button>

        </section>

    </main>


    <script src="./script.js"></script>

</body>

</html>
